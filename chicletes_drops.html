        .container { max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }

        .card p { font-size: 18px; font-weight: bold; color: #27ae60; margin: 0 0 15px 0; }
        .btn-add { background: #3498db; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn-add:hover { background: #2980b9; }
        
        /* Paginação */
        .pagination { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .pagination button { padding: 8px 12px; border: none; background: #ddd; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .pagination button.active { background: #27ae60; color: white; }

        /* Barra de Cotação WhatsApp */
        .whatsapp-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #25d366; color: white; text-align: center; padding: 15px; font-size: 18px; font-weight: bold; box-shadow: 0 -2px 5px rgba(0,0,0,0.2); z-index: 1000; display: flex; justify-content: center; align-items: center; gap: 15px; box-sizing: border-box; }
        .whatsapp-bar a { background: white; color: #25d366; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; }
        .whatsapp-bar a:hover { background: #f0f0f0; }
    </style>

        let paginaAtual = 1;
        const itensPorPagina = 12;
        let carrinho = [];

        function renderizarProdutos() {
            const grid = document.getElementById("product-grid");
            grid.innerHTML = "";

            const inicio = (paginaAtual - 1) * itensPorPagina;
            const fim = inicio + itensPorPagina;
            const itensPagina = produtos.slice(inicio, fim);

            itensPagina.forEach(prod => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <img src="${prod.imagem || 'https://via.placeholder.com/150?text=Sem+Foto'}" alt="${prod.nome}">
                    <h3>${prod.nome}</h3>
                    <p>R$ ${prod.preco.toFixed(2).replace('.', ',')}</p>
                    <button class="btn-add" onclick="adicionarItem('${prod.nome}', ${prod.preco})">Adicionar</button>
                `;
                grid.appendChild(card);
            });

            renderizarPaginacao();
        }

        function renderizarPaginacao() {
            const paginacao = document.getElementById("pagination");
            paginacao.innerHTML = "";

            const totalPaginas = Math.ceil(produtos.length / itensPorPagina);

            for (let i = 1; i <= totalPaginas; i++) {
                const btn = document.createElement("button");
                btn.innerText = i;
                if (i === paginaAtual) btn.className = "active";
                btn.onclick = () => {
                    paginaAtual = i;
                    renderizarProdutos();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                paginacao.appendChild(btn);
            }
        }

        function adicionarItem(nome, preco) {
            carrinho.push({ nome, preco });
            document.getElementById("contador-itens").innerText = carrinho.length;
            atualizarLinkWhatsApp();
        }

        function atualizarLinkWhatsApp() {
            const numeroWhatsApp = "5521968659086";
            let mensagem = "Olá! Gostaria de fazer a cotação dos seguintes produtos:\n\n";
            
            carrinho.forEach((item, index) => {
                mensagem += `${index + 1}. ${item.nome} - R$ ${item.preco.toFixed(2).replace('.', ',')}\n`;
            });

            const linkEncoded = encodeURI(mensagem);
            document.getElementById("btn-cotar").href = `https://wa.me/${numeroWhatsApp}?text=${linkEncoded}`;
        }

        renderizarProdutos();
