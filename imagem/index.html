<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Distribuidora Frazão</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: #1a365d;
            font-size: 2rem;
            margin-bottom: 5px;
        }
        header p {
            color: #666;
            font-size: 1rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #e2e8f0;
        }
        .card-title {
            padding: 15px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #2d3748;
        }
    </style>
</head>
<body>

    <header>
        <h1>Distribuidora Frazão</h1>
        <p>Selecione uma categoria abaixo para ver os produtos</p>
    </header>

    <div class="container">
        <!-- Balas e Pirulitos -->
        <a href="imagem/balas-e-pirulitos/" class="card">
            <div class="card-title">Balas e Pirulitos</div>
        </a>

        <!-- Bebidas -->
        <a href="imagem/bebidas/" class="card">
            <div class="card-title">Bebidas</div>
        </a>

        <!-- Biscoitos -->
        <a href="imagem/biscoitos/" class="card">
            <div class="card-title">Biscoitos</div>
        </a>

        <!-- Chicletes e Drops -->
        <a href="imagem/chicletes-e-drops/" class="card">
            <div class="card-title">Chicletes e Drops</div>
        </a>

        <!-- Descartáveis -->
        <a href="imagem/descartaveis/" class="card">
            <div class="card-title">Descartáveis</div>
        </a>

        <!-- Doces -->
        <a href="imagem/doces/" class="card">
            <div class="card-title">Doces</div>
        </a>

        <!-- Higiene -->
        <a href="imagem/higiene/" class="card">
            <div class="card-title">Higiene</div>
        </a>

        <!-- Limpeza -->
        <a href="imagem/limpeza/" class="card">
            <div class="card-title">Limpeza</div>
        </a>

        <!-- Mercearia -->
        <a href="imagem/mercearia/" class="card">
            <div class="card-title">Mercearia</div>
        </a>

        <!-- Papelaria -->
        <a href="imagem/papelaria/" class="card">
            <div class="card-title">Papelaria</div>
        </a>
    </div>

</body>
</html>
