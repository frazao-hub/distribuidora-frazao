<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Distribuidora Frazão</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Firebase App (v10 Modular SDK via CDN para Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-4">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Distribuidora Frazão - Painel Administrativo</h1>
        
        <!-- Abas de Navegação -->
        <div class="flex border-b border-gray-200 mb-6 overflow-x-auto">
            <button onclick="mudarAba('vendedor')" id="tab-vendedor" class="py-2 px-4 font-semibold text-blue-600 border-b-2 border-blue-600 focus:outline-none whitespace-nowrap">Vendedor</button>
            <button onclick="mudarAba('cliente')" id="tab-cliente" class="py-2 px-4 font-semibold text-gray-500 hover:text-blue-600 focus:outline-none whitespace-nowrap">Cliente</button>
            <button onclick="mudarAba('produto')" id="tab-produto" class="py-2 px-4 font-semibold text-gray-500 hover:text-blue-600 focus:outline-none whitespace-nowrap">Produto</button>
            <button onclick="mudarAba('historico')" id="tab-historico" class="py-2 px-4 font-semibold text-gray-500 hover:text-blue-600 focus:outline-none whitespace-nowrap">Histórico</button>
        </div>

        <!-- Formulário de Cadastro (Usado para Vendedor, Cliente e Produto) -->
        <div id="secao-formulario">
            <form id="cadastroForm" class="space-y-4">
                <input type="hidden" id="tipoRegistro" value="vendedor">

                <div>
                    <label id="labelNome" class="block text-sm font-medium text-gray-700">Nome do Vendedor</label>
                    <input type="text" id="campoNome" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Digite o nome...">
                </div>

                <div>
                    <label id="labelDetalhes" class="block text-sm font-medium text-gray-700">Observações / Detalhes</label>
                    <input type="text" id="campoDetalhes" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Informações adicionais...">
                </div>

                <button type="submit" id="btnSalvar" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200">
                    Salvar Registro
                </button>
            </form>
            <div id="mensagemStatus" class="mt-4 text-center text-sm font-medium"></div>
        </div>

        <!-- Seção de Histórico / Listagem -->
        <div id="secao-historico" class="hidden">
            <h2 class="text-lg font-bold text-gray-700 mb-4">Histórico de Cadastros</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 border">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Tipo</th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Nome</th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Detalhes</th>
                            <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Data</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaHistorico" class="bg-white divide-y divide-gray-200 text-sm text-gray-700">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO FIREBASE (Certifique-se de manter suas chaves corretas)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "distribuidora-frazao.firebaseapp.com",
            projectId: "distribuidora-frazao",
            storageBucket: "distribuidora-frazao.appspot.com",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Função para alternar entre as abas
        function mudarAba(aba) {
            const tabs = ['vendedor', 'cliente', 'produto', 'historico'];
            tabs.forEach(t => {
                const btn = document.getElementById('tab-' + t);
                if (t === aba) {
                    btn.className = "py-2 px-4 font-semibold text-blue-600 border-b-2 border-blue-600 focus:outline-none whitespace-nowrap";
                } else {
                    btn.className = "py-2 px-4 font-semibold text-gray-500 hover:text-blue-600 focus:outline-none whitespace-nowrap";
                }
            });

            const secaoForm = document.getElementById('secao-formulario');
            const secaoHist = document.getElementById('secao-historico');
            const tipoInput = document.getElementById('tipoRegistro');
            const labelNome = document.getElementById('labelNome');

            if (aba === 'historico') {
                secaoForm.classList.add('hidden');
                secaoHist.classList.remove('hidden');
                carregarHistorico();
            } else {
                secaoForm.classList.remove('hidden');
                secaoHist.classList.add('hidden');
                tipoInput.value = aba;
                labelNome.textContent = `Nome do ${aba.charAt(0).toUpperCase() + aba.slice(1)}`;
                document.getElementById('campoNome').placeholder = `Digite o nome do ${aba}...`;
            }
        }

        // Envio do formulário com proteção anti-double click
        const form = document.getElementById('cadastroForm');
        const btnSalvar = document.getElementById('btnSalvar');
        const mensagemStatus = document.getElementById('mensagemStatus');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            btnSalvar.disabled = true;
            btnSalvar.textContent = "Salvando...";
            mensagemStatus.textContent = "";

            const tipo = document.getElementById('tipoRegistro').value;
            const nome = document.getElementById('campoNome').value;
            const detalhes = document.getElementById('campoDetalhes').value;

            try {
                await db.collection('registros').add({
                    tipo: tipo,
                    nome: nome,
                    detalhes: detalhes,
                    criadoEm: new Date().toISOString()
                });

                mensagemStatus.textContent = "Salvo com sucesso!";
                mensagemStatus.className = "mt-4 text-center text-sm font-medium text-green-600";
                form.reset();
                document.getElementById('tipoRegistro').value = tipo; // Mantém a seleção atual
            } catch (error) {
                console.error("Erro ao salvar:", error);
                mensagemStatus.textContent = "Erro ao salvar: " + error.message;
                mensagemStatus.className = "mt-4 text-center text-sm font-medium text-red-600";
            } finally {
                btnSalvar.disabled = false;
                btnSalvar.textContent = "Salvar Registro";
            }
        });

        // Carregar dados para o Histórico
        async function carregarHistorico() {
            const tbody = document.getElementById('tabelaHistorico');
            tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-4 text-center text-gray-500">Carregando histórico...</td></tr>`;

            try {
                const snapshot = await db.collection('registros').orderBy('criadoEm', 'desc').get();
                tbody.innerHTML = "";

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-4 text-center text-gray-500">Nenhum registro encontrado.</td></tr>`;
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const dataFormatada = data.criadoEm ? new Date(data.criadoEm).toLocaleString('pt-BR') : '-';
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="px-4 py-2 uppercase font-semibold text-xs text-blue-600">${data.tipo || '-'}</td>
                        <td class="px-4 py-2">${data.nome || '-'}</td>
                        <td class="px-4 py-2">${data.detalhes || '-'}</td>
                        <td class="px-4 py-2 text-xs text-gray-500">${dataFormatada}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Erro ao carregar histórico:", error);
                tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-4 text-center text-red-500">Erro ao carregar dados.</td></tr>`;
            }
        }
    </script>
</body>
</html>
