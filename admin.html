<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Distribuidora Frazão</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Firebase App (v10 Modular SDK via CDN compatível para Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-4">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Distribuidora Frazão - Cadastro</h1>
        
        <form id="cadastroForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Tipo de Registro</label>
                <select id="tipoRegistro" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                    <option value="vendedor">Vendedor</option>
                    <option value="cliente">Cliente</option>
                    <option value="produto">Produto</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Nome / Descrição</label>
                <input type="text" id="nomeRegistro" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Digite o nome...">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Detalhes / Observação</label>
                <input type="text" id="detalhesRegistro" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Informações adicionais...">
            </div>

            <button type="submit" id="btnSalvar" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200">
                Salvar Registro
            </button>
        </form>

        <div id="mensagemStatus" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <script>
        // CONFIGURAÇÃO DO FIREBASE (Substitua abaixo com as chaves reais do seu projeto do Realtime Database)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "distribuidora-frazao.firebaseapp.com",
            databaseURL: "https://distribuidora-frazao-default-rtdb.firebaseio.com",
            projectId: "distribuidora-frazao",
            storageBucket: "distribuidora-frazao.appspot.com",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        const form = document.getElementById('cadastroForm');
        const btnSalvar = document.getElementById('btnSalvar');
        const mensagemStatus = document.getElementById('mensagemStatus');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Anti-Double Click: desativa o botão e muda o texto para evitar duplicidade
            btnSalvar.disabled = true;
            btnSalvar.textContent = "Salvando...";
            mensagemStatus.textContent = "";

            const tipo = document.getElementById('tipoRegistro').value;
            const nome = document.getElementById('nomeRegistro').value;
            const detalhes = document.getElementById('detalhesRegistro').value;

            try {
                // Cria uma referência única no Realtime Database baseada no tipo escolhido
                const novoRegistroRef = database.ref(tipo + 's').push();
                
                await novoRegistroRef.set({
                    nome: nome,
                    detalhes: detalhes,
                    criadoEm: new Date().toISOString()
                });

                mensagemStatus.textContent = "Salvo com sucesso!";
                mensagemStatus.className = "mt-4 text-center text-sm font-medium text-green-600";
                form.reset();
            } catch (error) {
                console.error("Erro ao salvar:", error);
                mensagemStatus.textContent = "Erro ao salvar: " + error.message;
                mensagemStatus.className = "mt-4 text-center text-sm font-medium text-red-600";
            } finally {
                // Reativa o botão independentemente do sucesso ou erro
                btnSalvar.disabled = false;
                btnSalvar.textContent = "Salvar Registro";
            }
        });
    </script>
</body>
</html>
