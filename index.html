<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo & Cotação de Produtos</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f1f5f9; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #0f172a; }
        
        .nav-categorias { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; justify-content: center; }
        .btn-cat { background: #e2e8f0; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .btn-cat:hover, .btn-cat.ativo { background: #2563eb; color: white; }

        .layout { display: flex; gap: 20px; max-width: 1100px; margin: auto; flex-wrap: wrap; }
        .vitrine { flex: 2; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card-produto { background: white; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; text-align: center; }
        .card-produto h4 { margin: 10px 0 5px; color: #1e293b; }
        .tag-cat { font-size: 0.75em; background: #f1f5f9; padding: 3px 8px; border-radius: 4px; color: #64748b; }
        .btn-add { background: #2563eb; color: white; border: none; width: 100%; padding: 8px; border-radius: 4px; cursor: pointer; margin-top: 10px; }

        .carrinho-cotacao { flex: 1; min-width: 300px; background: white; padding: 20px; border-radius: 8px; height: fit-content; border: 1px solid #e2e8f0; }
        .tabela-carrinho { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        .tabela-carrinho th, .tabela-carrinho td { padding: 8px 4px; font-size: 0.85em; text-align: left; border-bottom: 1px solid #eee; }
        .btn-whats { background: #16a34a; color: white; border: none; width: 100%; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 1em; }
    </style>
</head>
<body>

<h1>Catálogo Geral - Distribuidora</h1>

<!-- Menu de Categorias -->
<div class="nav-categorias">
    <button class="btn-cat ativo" onclick="filtrar('todas', this)">Todas</button>
    <button class="btn-cat" onclick="filtrar('Mercearia', this)">Mercearia</button>
    <button class="btn-cat" onclick="filtrar('Doces', this)">Doces</button>
    <button class="btn-cat" onclick="filtrar('Bebidas', this)">Bebidas</button>
    <button class="btn-cat" onclick="filtrar('Papelaria', this)">Papelaria</button>
    <button class="btn-cat" onclick="filtrar('Higiene e Limpeza', this)">Higiene/Limpeza</button>
    <button class="btn-cat" onclick="filtrar('Descartaveis', this)">Descartáveis</button>
</div>

<div class="layout">
    <!-- Grade de Produtos -->
    <div class="vitrine" id="grade-produtos"></div>

    <!-- Carrinho de Cotação -->
    <div class="carrinho-cotacao">
        <h3>Sua Cotação</h3>
        <table class="tabela-carrinho">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Qtd</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="itens-carrinho">
                <!-- Adicionado via JS -->
            </tbody>
        </table>
        <p><strong>Total de itens:</strong> <span id="total-itens">0</span></p>
        <button class="btn-whats" onclick="enviarCotacaoWhatsApp()">Solicitar Cotação via WhatsApp</button>
    </div>
</div>

<script>
    // Configuração do WhatsApp da Empresa (Apenas números: DDI + DDD + Telefone)
    const SEU_NUMERO_WHATSAPP = "5521999999999"; 

    // Base de Produtos de Todos os Catálogos
    const produtos = [
        { id: 1, nome: "Café Tradicional 500g", categoria: "Mercearia" },
        { id: 2, nome: "Pacote Bisnaguinha 300g", categoria: "Mercearia" },
        { id: 3, nome: "Caixa Bala de Goma (24 un)", categoria: "Doces" },
        { id: 4, nome: "Paçoca Embalada", categoria: "Doces" },
        { id: 5, nome: "Refrigerante 2L", categoria: "Bebidas" },
        { id: 6, nome: "Suco em Pó (Caixa)", categoria: "Bebidas" },
        { id: 7, nome: "Caderno Universitário 10M", categoria: "Papelaria" },
        { id: 8, nome: "Caixa Caneta Azul (50 un)", categoria: "Papelaria" },
        { id: 9, nome: "Detergente Neutro 500ml", categoria: "Higiene e Limpeza" },
        { id: 10, nome: "Sabonete em Barra (Caixa)", categoria: "Higiene e Limpeza" },
        { id: 11, nome: "Copo Descartável 180ml (100un)", categoria: "Descartaveis" },
        { id: 12, nome: "Guardanapo de Papel Pacote", categoria: "Descartaveis" }
    ];

    let carrinho = [];

    function renderizarProdutos(lista) {
        const grid = document.getElementById("grade-produtos");
        grid.innerHTML = "";
        lista.forEach(p => {
            grid.innerHTML += `
                <div class="card-produto">
                    <span class="tag-cat">${p.categoria}</span>
                    <h4>${p.nome}</h4>
                    <button class="btn-add" onclick="adicionarAoCarrinho(${p.id})">+ Adicionar à Cotação</button>
                </div>
            `;
        });
    }

    function filtrar(cat, elemento) {
        document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('ativo'));
        elemento.classList.add('ativo');
        
        if (cat === 'todas') {
            renderizarProdutos(produtos);
        } else {
            const filtrados = produtos.filter(p => p.categoria === cat);
            renderizarProdutos(filtrados);
        }
    }

    function adicionarAoCarrinho(idProduto) {
        const itemExistente = carrinho.find(item => item.id === idProduto);
        if (itemExistente) {
            itemExistente.qtd += 1;
        } else {
            const produtoOriginal = produtos.find(p => p.id === idProduto);
            carrinho.push({ ...produtoOriginal, qtd: 1 });
        }
        atualizarCarrinho();
    }

    function removerDoCarrinho(idProduto) {
        carrinho = carrinho.filter(item => item.id !== idProduto);
        atualizarCarrinho();
    }

    function atualizarCarrinho() {
        const tbody = document.getElementById("itens-carrinho");
        tbody.innerHTML = "";
        let totalQtd = 0;

        carrinho.forEach(item => {
            totalQtd += item.qtd;
            tbody.innerHTML += `
                <tr>
                    <td>${item.nome}</td>
                    <td>${item.qtd}</td>
                    <td><button onclick="removerDoCarrinho(${item.id})" style="background:red; color:white; border:none; border-radius:3px; cursor:pointer;">X</button></td>
                </tr>
            `;
        });

        document.getElementById("total-itens").innerText = totalQtd;
    }

    function enviarCotacaoWhatsApp() {
        if (carrinho.length === 0) {
            alert("Sua lista de cotação está vazia! Adicione produtos primeiro.");
            return;
        }

        let mensagem = "Olá! Gostaria de receber uma cotação para os seguintes itens:\n\n";
        carrinho.forEach(item => {
            mensagem += `• *${item.nome}* (${item.categoria}) - Qtd: ${item.qtd}\n`;
        });

        const linkWhatsApp = `https://wa.me/${SEU_NUMERO_WHATSAPP}?text=${encodeURIComponent(mensagem)}`;
        window.open(linkWhatsApp, "_blank");
    }

    // Inicialização
    renderizarProdutos(produtos);
</script>

</body>
</html>
