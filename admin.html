<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Distribuidora Frazão</title>
    <!-- Tailwind CSS para estilização rápida -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-6 bg-white p-4 rounded-lg shadow">
            <h1 class="text-2xl font-bold text-gray-800">📦 Distribuidora Frazão - Painel Administrativo</h1>
            <span class="text-sm text-gray-500">Gestão de Vendas</span>
        </header>

        <!-- Área de Listagem de Pedidos -->
        <div class="bg-white rounded-lg shadow overflow-hidden p-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">Pedidos Recentes</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID / Data</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cliente</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Vendedor</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaPedidos" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="5" class="px-6 py-4 text-center text-gray-500">Carregando pedidos do Firebase...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal de Visualização do Recibo -->
    <div id="modalImpressao" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg max-w-md w-full p-6 relative">
            <h3 class="text-xl font-bold mb-4 text-gray-800">Visualizar Comprovante</h3>
            
            <div id="conteudoRecibo" class="border p-4 rounded bg-gray-50 mb-4 text-sm max-h-96 overflow-y-auto">
                <!-- O recibo será injetado aqui -->
            </div>

            <div class="flex justify-end space-x-3">
                <button onclick="fecharModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded font-semibold">Fechar</button>
                <button onclick="imprimirCupomIsolado()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-semibold">🖨️ Imprimir / Salvar PDF</button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // Configuração do Firebase da Distribuidora Frazão
        const firebaseConfig = {
            apiKey: "AIzaSyD8SnMWXagUVz4uVM87bc2dAakZyGGW3nM",
            authDomain: "distribuidora-frazao.firebaseapp.com",
            projectId: "distribuidora-frazao",
            storageBucket: "distribuidora-frazao.firebasestorage.app",
            messagingSenderId: "642540059204",
            appId: "1:642540059204:web:c113fa6966fd97fc20da11"
        };

        if (!firebase.apps.length) { 
            firebase.initializeApp(firebaseConfig); 
        }
        const db = firebase.firestore();

        let pedidoAtualCache = null;

        // Carregar vendas do Firestore ao iniciar a página
        window.onload = function() {
            carregarHistoricoVendasAdmin();
        };

        function carregarHistoricoVendasAdmin() {
            db.collection("vendas").orderBy("data", "desc").onSnapshot(snapshot => {
                const tbody = document.getElementById('tabelaPedidos');
                tbody.innerHTML = '';

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">Nenhuma venda registrada ainda.</td></tr>`;
                    return;
                }

                snapshot.forEach(doc => {
                    const v = { id: doc.id, ...doc.data() };
                    
                    tbody.innerHTML += `
                        <tr>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                <strong>#${v.id.substring(0,6)}</strong><br>
                                <span class="text-xs text-gray-500">${new Date(v.data).toLocaleString('pt-BR')}</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${v.clienteNome || 'Cliente Balcão'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${v.vendedor || 'Geral'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-green-600">R$ ${Number(v.total || 0).toFixed(2)}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <button onclick='abrirModalPedido(${JSON.stringify(v)})' class="bg-blue-100 text-blue-700 hover:bg-blue-200 px-3 py-1 rounded text-xs font-bold">Ver Comprovante</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        function abrirModalPedido(pedido) {
            pedidoAtualCache = pedido;
            
            let itensHtml = '';
            if (pedido.itens) {
                pedido.itens.forEach(i => {
                    itensHtml += `<tr><td>${i.nome}</td><td>${i.qtd}x</td><td style="text-align:right;">R$ ${Number(i.subtotal).toFixed(2)}</td></tr>`;
                });
            }

            document.getElementById('conteudoRecibo').innerHTML = `
                <p><strong>ID do Pedido:</strong> ${pedido.id}</p>
                <p><strong>Cliente:</strong> ${pedido.clienteNome || 'Balcão'}</p>
                <p><strong>Data:</strong> ${new Date(pedido.data).toLocaleString('pt-BR')}</p>
                <p><strong>Forma de Pagamento:</strong> ${pedido.formaPagamento || 'Dinheiro/Pix'}</p>
                <hr style="margin: 8px 0; border-top: 1px dashed #ccc;">
                <table style="width: 100%; font-size: 12px;">
                    ${itensHtml}
                </table>
                <hr style="margin: 8px 0; border-top: 1px dashed #ccc;">
                <p style="text-align: right; font-size: 14px;"><strong>Total: R$ ${Number(pedido.total).toFixed(2)}</strong></p>
            `;

            document.getElementById('modalImpressao').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modalImpressao').classList.add('hidden');
        }

        // Função isolada de impressão (Gera uma aba limpa focada em cor 100% preta e página única)
        function imprimirCupomIsolado() {
            if (!pedidoAtualCache) return;

            let itensHtml = '';
            if (pedidoAtualCache.itens) {
                pedidoAtualCache.itens.forEach(i => {
                    itensHtml += `<tr><td>${i.nome}</td><td>${i.qtd}x R$${Number(i.preco).toFixed(2)}</td><td style="text-align:right;">R$${Number(i.subtotal).toFixed(2)}</td></tr>`;
                });
            }

            const janelaImpressao = window.open('', '_blank', 'width=400,height=600');
            
            janelaImpressao.document.write(`
                <html>
                    <head>
                        <title>Comprovante - Distribuidora Frazão</title>
                        <style>
                            body {
                                font-family: Arial, sans-serif;
                                font-size: 12px;
                                color: #000000;
                                margin: 0;
                                padding: 10px;
                                background: #fff;
                                -webkit-print-color-adjust: exact;
                                print-color-adjust: exact;
                            }
                            h2 { font-size: 16px; margin: 0 0 5px 0; text-align: center; color: #000; }
                            p { margin: 3px 0; font-weight: bold; color: #000; }
                            table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 8px; }
                            th, td { padding: 4px; text-align: left; border-bottom: 1px dashed #000; color: #000; font-weight: bold; }
                            .text-right { text-align: right; }
                            hr { border: none; border-top: 1px dashed #000; margin: 8px 0; }
                        </style>
                    </head>
                    <body>
                        <div style="text-align: center;">
                            <h2>Distribuidora Frazão</h2>
                            <p>Comprovante de Pedido / Venda</p>
                        </div>
                        <hr>
                        <p><strong>Pedido ID:</strong> ${pedidoAtualCache.id ? pedidoAtualCache.id.substring(0,6) : 'N/A'}</p>
                        <p><strong>Data:</strong> ${new Date(pedidoAtualCache.data || Date.now()).toLocaleString('pt-BR')}</p>
                        <p><strong>Cliente:</strong> ${pedidoAtualCache.clienteNome || 'Balcão'}</p>
                        <p><strong>Pagamento:</strong> ${pedidoAtualCache.formaPagamento || 'Dinheiro/Pix'}</p>
                        <hr>
                        <table>
                            <thead>
                                <tr>
                                    <th>Produto</th>
                                    <th>Qtd/Preço</th>
                                    <th class="text-right">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${itensHtml}
                            </tbody>
                        </table>
                        <hr>
                        <p class="text-right" style="font-size: 14px; margin-top: 5px;"><strong>TOTAL: R$ ${Number(pedidoAtualCache.total || 0).toFixed(2)}</strong></p>
                        
                        <script>
                            window.onload = function() {
                                setTimeout(() => {
                                    window.print();
                                }, 400);
                            }
                        <\/script>
                    </body>
                </html>
            `);
            janelaImpressao.document.close();
        }
    </script>
</body>
</html>
