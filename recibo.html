<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprovante de Venda - Distribuidora Frazão</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 10px;
      color: #333;
    }

    .cupom {
      max-width: 320px;
      margin: 0 auto;
      background: #fff;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .center { text-align: center; }
    .right { text-align: right; }
    .bold { font-weight: bold; }
    .linha { border-bottom: 1px dashed #000; margin: 10px 0; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 4px 0;
      text-align: left;
    }

    .botoes-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    .btn {
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-imprimir { background-color: #27ae60; }
    .btn-imprimir:hover { background-color: #219150; }

    .btn-whatsapp { background-color: #25D366; }
    .btn-whatsapp:hover { background-color: #1ebc57; }

    @media print {
      .no-print { display: none !important; }
      body { background: #fff; padding: 0; margin: 0; }
      .cupom { border: none; width: 100%; max-width: 78mm; padding: 0; }
    }
  </style>
</head>
<body>

  <div class="cupom">
    <!-- BOTÕES DE AÇÃO -->
    <div class="botoes-container no-print">
      <button class="btn btn-imprimir" onclick="imprimirCupomDireto()">
        🖨️ IMPRIMIR RECIBO (80MM)
      </button>
      <button class="btn btn-whatsapp" onclick="enviarWhatsApp()">
        📲 ENVIAR VIA WHATSAPP
      </button>
    </div>

    <!-- CABEÇALHO DO RECIBO -->
    <div class="center">
      <div class="bold" style="font-size: 16px;">DISTRIBUIDORA FRAZÃO</div>
      <div style="font-size: 12px; color: #555;">Comprovante de Pedido / Venda</div>
    </div>

    <div class="linha"></div>

    <!-- DADOS DO PEDIDO (DINÂMICOS) -->
    <div style="font-size: 12px; line-height: 1.5;">
      <b>Pedido Nº:</b> <span id="numPedido">0001</span><br>
      <b>Data:</b> <span id="dataPedido">--/--/----</span><br>
      <b>Cliente:</b> <span id="nomeCliente">Consumidor</span><br>
      <b>Vendedor:</b> <span id="nomeVendedor">Angelo</span><br>
      <b>Forma de Pagamento:</b> <span id="formaPagamento">A vista</span>
    </div>

    <div class="linha"></div>

    <!-- TABELA DE ITENS (DINÂMICA) -->
    <table>
      <thead>
        <tr>
          <th>ITEM</th>
          <th class="center">QTD</th>
          <th class="right">SUBTOTAL</th>
        </tr>
      </thead>
      <tbody id="corpoTabelaItens">
        <!-- Os produtos inseridos na venda vão aparecer aqui -->
      </tbody>
    </table>

    <div class="linha"></div>

    <!-- TOTALIZADORES (DINÂMICOS) -->
    <table>
      <tr>
        <td>Subtotal:</td>
        <td class="right" id="valorSubtotal">R$ 0,00</td>
      </tr>
      <tr>
        <td>Desconto:</td>
        <td class="right" id="valorDesconto">R$ 0,00</td>
      </tr>
      <tr>
        <td class="bold" style="font-size: 14px;">Total Final:</td>
        <td class="right bold" style="font-size: 14px;" id="valorTotal">R$ 0,00</td>
      </tr>
    </table>

    <div class="linha"></div>

    <div class="center" style="font-size: 11px; color: #666;">
      Obrigado pela preferência!<br>
      Distribuidora Frazão
    </div>
  </div>

  <script>
    // FUNÇÃO QUE CAPTURA OS DADOS DA TELA AUTOMATICAMENTE
    function obterDadosDaTela() {
      const pedido = document.getElementById("numPedido")?.innerText || "";
      const data = document.getElementById("dataPedido")?.innerText || "";
      const cliente = document.getElementById("nomeCliente")?.innerText || "";
      const vendedor = document.getElementById("nomeVendedor")?.innerText || "";
      const pagamento = document.getElementById("formaPagamento")?.innerText || "";
      const subtotal = document.getElementById("valorSubtotal")?.innerText || "R$ 0,00";
      const desconto = document.getElementById("valorDesconto")?.innerText || "R$ 0,00";
      const total = document.getElementById("valorTotal")?.innerText || "R$ 0,00";

      let itens = [];
      const linhasTabela = document.querySelectorAll("#corpoTabelaItens tr");
      linhasTabela.forEach(tr => {
        const tds = tr.querySelectorAll("td");
        if (tds.length >= 3) {
          itens.push({
            nome: tds[0].innerText.trim(),
            qtd: tds[1].innerText.trim(),
            subtotal: tds[2].innerText.trim()
          });
        }
      });

      return { pedido, data, cliente, vendedor, pagamento, subtotal, desconto, total, itens };
    }

    // 1. IMPRESSÃO DIRETA DE TEXTO PARA A IMPRESSORA (EVITA O FATIAMENTO EM PÁGINAS DO CHROME)
    function imprimirCupomDireto() {
      const dados = obterDadosDaTela();

      let texto = "DISTRIBUIDORA FRAZAO\n";
      texto += "Comprovante de Pedido / Venda\n";
      texto += "--------------------------------\n";
      if (dados.pedido) texto += "Pedido No: " + dados.pedido + "\n";
      if (dados.data) texto += "Data: " + dados.data + "\n";
      if (dados.cliente) texto += "Cliente: " + dados.cliente + "\n";
      if (dados.vendedor) texto += "Vendedor: " + dados.vendedor + "\n";
      if (dados.pagamento) texto += "Pagamento: " + dados.pagamento + "\n";
      texto += "--------------------------------\n";
      texto += "ITENS:\n";

      if (dados.itens.length > 0) {
        dados.itens.forEach(item => {
          texto += `${item.qtd} ${item.nome} - ${item.subtotal}\n`;
        });
      } else {
        texto += "(Nenhum item listado)\n";
      }

      texto += "--------------------------------\n";
      texto += "Subtotal: " + dados.subtotal + "\n";
      texto += "Desconto: " + dados.desconto + "\n";
      texto += "TOTAL FINAL: " + dados.total + "\n";
      texto += "--------------------------------\n";
      texto += "Obrigado pela preferencia!\n\n\n";

      // Dispara o texto puro para o app de impressora Bluetooth (RawBT)
      const intentUrl = "intent:#Intent;scheme=rawbt;package=ru.a404m.rawbt;S.text=" + encodeURIComponent(texto) + ";end;";

      try {
        window.location.href = intentUrl;
      } catch (e) {
        window.print();
      }
    }

    // 2. DISPARO DINÂMICO PARA O WHATSAPP
    function enviarWhatsApp() {
      const dados = obterDadosDaTela();

      let mensagem = "*DISTRIBUIDORA FRAZÃO*\n";
      mensagem += "*Comprovante de Pedido / Venda*\n";
      mensagem += "-----------------------------------\n";
      if (dados.pedido) mensagem += "*Pedido Nº:* " + dados.pedido + "\n";
      if (dados.data) mensagem += "*Data:* " + dados.data + "\n";
      if (dados.cliente) mensagem += "*Cliente:* " + dados.cliente + "\n";
      if (dados.vendedor) mensagem += "*Vendedor:* " + dados.vendedor + "\n";
      if (dados.pagamento) mensagem += "*Forma de Pagamento:* " + dados.pagamento + "\n";
      mensagem += "-----------------------------------\n";
      mensagem += "*ITENS:*\n";

      if (dados.itens.length > 0) {
        dados.itens.forEach(item => {
          mensagem += `• ${item.qtd} ${item.nome} - ${item.subtotal}\n`;
        });
      } else {
        mensagem += "(Nenhum item)\n";
      }

      mensagem += "-----------------------------------\n";
      mensagem += "*Subtotal:* " + dados.subtotal + "\n";
      mensagem += "*Desconto:* " + dados.desconto + "\n";
      mensagem += "*TOTAL FINAL:* " + dados.total + "\n";
      mensagem += "-----------------------------------\n";
      mensagem += "Obrigado pela preferência!";

      const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(mensagem);
      window.open(url, "_blank");
    }
  </script>
</body>
</html>
