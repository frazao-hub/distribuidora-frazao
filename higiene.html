        .btn-limpar:hover { background: #c0392b; }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .card { background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 140px; object-fit: contain; border-radius: 4px; background: #fff; margin-bottom: 10px; }
        .card h3 { font-size: 15px; margin: 0 0 8px 0; color: #444; }
        .card p { font-size: 16px; font-weight: bold; color: #27ae60; margin: 0 0 12px 0; }

        .btn-add:hover { background: #2980b9; }

        .card-controles { display: flex; align-items: center; justify-content: space-between; background: #f8f9fa; border: 1px solid #ddd; border-radius: 5px; padding: 4px; }
        .card-controles button { background: #3498db; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 14px; }
        .card-controles button:hover { background: #2980b9; }

        let paginaAtual = 1;
        const itensPorPagina = 12;

        // Carrega o carrinho salvo no navegador (funciona entre diferentes páginas do site)
        let carrinho = JSON.parse(localStorage.getItem('carrinho_distribuidora')) || {};

        function escaparJS(texto) {
            return String(texto).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
        }

        function obterClienteCadastrado() {
            const dados = localStorage.getItem("cliente") || localStorage.getItem("clienteFrazao");
            if (!dados) return null;
            try {
                const parsed = JSON.parse(dados);
                if (typeof parsed === "object" && parsed !== null) {
                    return parsed.nome || parsed.razaoSocial || parsed.empresa || "Cliente cadastrado";
                }
                return String(dados);
            } catch (e) {
                return String(dados);
            }
        }

        function atualizarCadastroUI() {
            const aviso = document.getElementById("aviso-cadastro");
            const statusCliente = document.getElementById("status-cliente");
            const clienteNome = obterClienteCadastrado();

            if (aviso) {
                aviso.href = urlCadastro;
            }

            if (clienteNome) {
                if (aviso) aviso.style.display = "none";
                if (statusCliente) {
                    statusCliente.style.display = "block";
                    statusCliente.innerText = `✓ Cliente: ${clienteNome}`;
                }
            } else {
                if (aviso) aviso.style.display = "inline-block";
                if (statusCliente) statusCliente.style.display = "none";
            }

            return clienteNome;
        }

        function renderizarProdutos() {
            const linkVoltar = document.getElementById("link-voltar");
            if (linkVoltar) linkVoltar.href = urlHome;

            const grid = document.getElementById("product-grid");
            grid.innerHTML = "";

            const inicio = (paginaAtual - 1) * itensPorPagina;
            const fim = inicio + itensPorPagina;
            const itensPagina = produtos.slice(inicio, fim);

            itensPagina.forEach(prod => {
                const card = document.createElement("div");
                card.className = "card";
                const imgTag = prod.imagem ? `<img src="${prod.imagem}" alt="${prod.nome}">` : '';
                const qtdNoCarrinho = carrinho[prod.id] ? carrinho[prod.id].quantidade : 0;
                const nomeJS = escaparJS(prod.nome);

                let acaoHTML = "";
                if (qtdNoCarrinho === 0) {
                    acaoHTML = `<button class="btn-add" onclick="alterarQuantidade('${prod.id}', '${nomeJS}', ${prod.preco}, 1)">Adicionar</button>`;
                } else {
                    acaoHTML = `
                        <div class="card-controles">
                            <button onclick="alterarQuantidade('${prod.id}', '${nomeJS}', ${prod.preco}, -1)">-</button>
                            <span>${qtdNoCarrinho}</span>
                            <button onclick="alterarQuantidade('${prod.id}', '${nomeJS}', ${prod.preco}, 1)">+</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${imgTag}
                    <h3>${prod.nome}</h3>
                    <p>R$ ${prod.preco.toFixed(2).replace('.', ',')}</p>
                    ${acaoHTML}
                `;
                grid.appendChild(card);
            });

            renderizarPaginacao();
        }

        function renderizarPaginacao() {
            const paginacao = document.getElementById("pagination");
            paginacao.innerHTML = "";

            const totalPaginas = Math.ceil(produtos.length / itensPorPagina);

            for (let i = 1; i <= totalPaginas; i++) {
                const btn = document.createElement("button");
                btn.innerText = i;
                if (i === paginaAtual) btn.className = "active";
                btn.onclick = () => {
                    paginaAtual = i;
                    renderizarProdutos();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                paginacao.appendChild(btn);
            }
        }

        function alterarQuantidade(id, nome, preco, delta) {
            if (!carrinho[id]) {
                if (delta > 0) {
                    carrinho[id] = { nome, preco, quantidade: delta };
                }
            } else {
                carrinho[id].quantidade += delta;
                if (carrinho[id].quantidade <= 0) {
                    delete carrinho[id];
                }
            }
            salvarESincronizar();
        }

        function limparCarrinho() {
            carrinho = {};
            salvarESincronizar();
        }

        function salvarESincronizar() {
            localStorage.setItem('carrinho_distribuidora', JSON.stringify(carrinho));
            renderizarProdutos();
            atualizarCarrinhoUI();
        }

        function atualizarCarrinhoUI() {
            const listaDiv = document.getElementById("lista-carrinho");
            const totalDiv = document.getElementById("carrinho-total");
            const btnLimpar = document.getElementById("btn-limpar-carrinho");
            const footerTotal = document.getElementById("footer-total");
            const btnCotar = document.getElementById("btn-cotar");

            listaDiv.innerHTML = "";
            let valorTotal = 0;
            let temItens = false;

            const clienteNome = atualizarCadastroUI();
            let mensagem = "Olá! Gostaria de fazer a cotação dos seguintes produtos:\n";
            if (clienteNome) {
                mensagem += `Cliente: ${clienteNome}\n`;
            }
            mensagem += "\n";
            let contador = 1;

            for (let id in carrinho) {
                temItens = true;
                let item = carrinho[id];
                let subtotal = item.preco * item.quantidade;
                valorTotal += subtotal;
                const nomeJS = escaparJS(item.nome);

                const itemDiv = document.createElement("div");
                itemDiv.className = "item-carrinho";
                itemDiv.innerHTML = `
                    <div class="detalhes">
                        <strong>${item.nome}</strong><br>
                        <small>R$ ${item.preco.toFixed(2).replace('.', ',')} x ${item.quantidade}</small>
                    </div>
                    <div class="controles">
                        <button onclick="alterarQuantidade('${id}', '${nomeJS}', ${item.preco}, -1)">-</button>
                        <span>${item.quantidade}</span>
                        <button onclick="alterarQuantidade('${id}', '${nomeJS}', ${item.preco}, 1)">+</button>
                    </div>
                `;
                listaDiv.appendChild(itemDiv);

                mensagem += `${contador}. ${item.quantidade}x ${item.nome} - R$ ${subtotal.toFixed(2).replace('.', ',')}\n`;
                contador++;
            }

            if (!temItens) {
                listaDiv.innerHTML = '<p style="color: #888; font-size: 14px;">Nenhum produto adicionado.</p>';
                totalDiv.style.display = "none";
                btnLimpar.style.display = "none";
            } else {
                totalDiv.style.display = "block";
                btnLimpar.style.display = "block";
                totalDiv.innerText = `Total: R$ ${valorTotal.toFixed(2).replace('.', ',')}`;
            }

            footerTotal.innerText = `R$ ${valorTotal.toFixed(2).replace('.', ',')}`;
            mensagem += `\n*Valor Total: R$ ${valorTotal.toFixed(2).replace('.', ',')}*`;

            const linkEncoded = encodeURI(mensagem);

            if (!clienteNome) {
                btnCotar.href = urlCadastro;
                btnCotar.removeAttribute("target");
                btnCotar.onclick = function(e) {
                    e.preventDefault();
                    alert("Cadastre-se para enviar o pedido.");
                    window.location.href = urlCadastro;
                };
            } else {
                btnCotar.href = `https://wa.me/${numeroWhatsApp}?text=${linkEncoded}`;
                btnCotar.setAttribute("target", "_blank");
                btnCotar.onclick = null;
            }
        }

        // Inicializa a página carregando o carrinho global
        renderizarProdutos();
        atualizarCarrinhoUI();
    </script>

</body>
</html>
