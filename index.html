<style>
/* Estilos do Cabeçalho */
.header-frazao {
    background-color: #ffffff;
    border-bottom: 3px solid #3b82f6;
    padding: 15px 20px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    margin-bottom: 25px;
}

.header-container {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.logo-area h1 {
    margin: 0;
    color: #1e293b;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.logo-area span {
    color: #3b82f6;
}

.subtitulo-header {
    margin: 3px 0 0 0;
    color: #64748b;
    font-size: 13px;
}

.busca-header {
    display: flex;
    align-items: center;
    flex-grow: 1;
    max-width: 400px;
}

.busca-header input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 6px 0 0 6px;
    outline: none;
    font-size: 14px;
}

.busca-header button {
    background-color: #3b82f6;
    color: #ffffff;
    border: none;
    padding: 10px 16px;
    border-radius: 0 6px 6px 0;
    cursor: pointer;
    font-weight: bold;
    transition: background-color 0.2s;
}

.busca-header button:hover {
    background-color: #1d4ed8;
}

.contato-header {
    text-align: right;
    font-size: 13px;
    color: #334155;
}

.contato-header strong {
    color: #25d366;
    display: block;
    font-size: 14px;
}
</style>

<!-- ESTRUTURA DO CABEÇALHO -->
<header class="header-frazao">
    <div class="header-container">
        
        <!-- LOGO / NOME -->
        <div class="logo-area">
            <h1>Distribuidora <span>Frazão</span></h1>
            <p class="subtitulo-header">Catálogo de Produtos & Cotações</p>
        </div>

        <!-- BARRA DE BUSCA -->
        <div class="busca-header">
            <input type="text" placeholder="Buscar produto no catálogo...">
            <button type="button">Buscar</button>
        </div>

        <!-- INFORMAÇÃO DE CONTATO/WHATSAPP -->
        <div class="contato-header">
            <span>Atendimento Rápido:</span>
            <strong>📱 (21) 96865-9086</strong>
        </div>

    </div>
</header>
