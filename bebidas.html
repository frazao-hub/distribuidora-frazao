<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Distribuidora Frazão - bebidas</title>
    <style>
        .bebidas-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .product-card {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .product-card:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .product-card img {
            max-width: 100%;
            height: 150px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .product-card h3 {
            font-size: 14px;
            margin: 10px 0;
            height: 40px;
        }
        .btn-cotacao {
            display: block;
            background-color: #25d366;
            color: white;
            padding: 10px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Distribuidora Frazão - bebidas</h1>

    <div class="bebidas-container">
        <!-- (Os blocos de produtos continuam aqui como no código anterior) -->
        <div class="product-card">
            <img src="LINK_DA_IMAGEM_AQUI" alt="Achocolatado Pirakids">
            <h3>Achocolatado Pirakids</h3>
            <a href="https://wa.me/5521968659086?text=Olá!%20Gostaria%20de%20fazer%20uma%20cotação%20do%20produto:%20Achocolatado%20Pirakids" target="_blank" class="btn-cotacao">Cotar via WhatsApp</a>
        </div>
        
        <!-- Adicione os demais produtos seguindo o mesmo modelo -->
    </div>

</body>
</html>
