<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora Frazão - Histórico de Vendas</title>
    <style>
        :root {
            --primary: #0056b3;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --light: #f8f9fa;
            --dark: #333;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            color: var(--dark);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2, h3 {
            color: var(--primary);
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }
        
        .btn-voltar {
            background-color: #6c757d;
            color: white;
            margin-bottom: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-voltar:hover { background-color: #5a6268; }

        button.btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .btn-print { background-color: #6c757d; color: white; margin-right: 4px; }
        .btn-share { background-color: #25D366; color: white; }
        
        /* Tabelas Responsivas */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; font-size: 13px; }
        th { background-color: var(--primary); color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--light);
            padding: 15px;
            border-radius: 6px;
            border-left: 5px solid var(--primary);
        }
        .card h4 { margin: 0 0 5px 0; color: #666; font-size: 13px; }
        .card p { font-size: 20px; font-weight: bold; margin: 0; color: var(--primary); }

        @media (max-width: 768px) {
            body { padding: 5px; }
            .container { padding: 10px; }
            h1 { font-size: 20px; }
            h2 { font-size: 18px; }
        }

        /* Estilo específico para impressão */
        @media print {
            body * { visibility: hidden; }
            #modalImpressao, #modalImpressao * { visibility: visible; }
            #modalImpressao {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 10px;
                background: white;
            }
            .nao-imprimir { display: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 8px; margin-bottom: 15px; flex-wrap: wrap; gap: 8px;">
        <h1 style="border:none; margin:0; padding:0; font-size: 20px;">Distribuidora Frazão</h1>
        <button class="btn-voltar" onclick="voltarParaAdmin()" style="margin:0;">← Voltar ao Menu Principal (admin.html)</button>
    </div>

    <!-- SEÇÃO: HISTÓRICO DE VENDAS -->
    <div id="aba-historico">
        <h2>📊 Histórico de Vendas</h2>
        
        <div class="dashboard-cards">
            <div class="card">
                <h4>Faturamento Total</h4>
                <p id="fatTotal">R$ 0,00</p>
            </div>
            <div class="card">
                <h4>Total de Pedidos</h4>
                <p id="totalQtdVendas">0</p>
            </div>
        </div>

        <h3>Registro de Pedidos</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Nº Pedido</th>
                        <th>Data / Hora</th>
                        <th>Cliente</th>
                        <th>Vendedor</th>
                        <th>Pgto</th>
                        <th>Total</th>
                        <th class="nao-imprimir">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaHistorico">
                    <tr><td colspan="7" style="text-align: center;">Carregando histórico de vendas...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL DE IMPRESSÃO / COMPROVANTE DE PEDIDO -->
<div id="modalImpressao" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center; padding: 10px; box-sizing: border-box;">
    <div style="background:white; width: 100%; max-width: 450px; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;">
        <div style="text-align: center; border-bottom: 2px dashed #ccc; padding-bottom: 10px; margin-bottom: 15px;">
            <h2 style="margin: 0; color: #0056b3; border:none; padding:0; font-size: 18px;">Distribuidora Frazão</h2>
            <p style="margin: 5px 0 0 0; font-size: 12px; color: #666;">Comprovante de Pedido / Venda</p>
        </div>
        
        <div id="conteudoReciboImpresso" style="font-size: 13px; line-height: 1.5;"></div>

        <div class="nao-imprimir" style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn btn-print" onclick="window.print()">🖨️ Imprimir</button>
            <button class="btn-voltar" style="margin:0; padding: 8px 12px;" onclick="fecharModalImpressao()">Fechar</button>
        </div>
    </div>
</div>

<!-- Firebase Scripts (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD8SnMWXagUVz4uVM87bc2dAakZyGGW3nM",
        authDomain: "distribuidora-frazao.firebaseapp.com",
        projectId: "distribuidora-frazao",
        storageBucket: "distribuidora-frazao.firebasestorage.app",
        messagingSenderId: "642540059204",
        appId: "1:642540059204:web:c113fa6966fd97fc20da11"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    let historicoVendasCache = [];

    // Função para retornar à página principal admin.html
    function voltarParaAdmin() {
        window.location.href = 'admin.html';
    }

    // CARREGAR HISTÓRICO DE VENDAS DO FIREBASE
    function carregarHistoricoVendas() {
        db.collection("historico_vendas").orderBy("numPedido", "desc").onSnapshot((snapshot) => {
            const tbody = document.getElementById('tabelaHistorico');
            if (!tbody) return;

            tbody.innerHTML = '';
            historicoVendasCache = [];
            let faturamento = 0;
            let totalPedidos = 0;

            if (snapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Nenhuma venda registrada até o momento.</td></tr>';
                document.getElementById('fatTotal').innerText = 'R$ 0,00';
                document.getElementById('totalQtdVendas').innerText = '0';
                return;
            }

            snapshot.forEach((doc) => {
                const p = doc.data();
                const id = doc.id;
                historicoVendasCache.push({ id, ...p });

                faturamento += Number(p.total) || 0;
                totalPedidos++;

                tbody.innerHTML += `
                    <tr>
                        <td>#${p.numPedido || 'N/A'}</td>
                        <td>${p.data || '-'}</td>
                        <td>${p.clienteNome || 'Cliente Não Informado'}</td>
                        <td>${p.vendedor || 'Geral'}</td>
                        <td>${p.formaPagamento || '-'}</td>
                        <td><strong>R$ ${Number(p.total || 0).toFixed(2)}</strong></td>
                        <td class="nao-imprimir">
                            <button class="btn btn-print" onclick="abrirComprovanteImpressao('${id}')">🖨️ Imprimir</button>
                            <button class="btn btn-share" onclick="compartilharPedidoWhatsApp('${id}')">📲 Compartilhar</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('fatTotal').innerText = `R$ ${faturamento.toFixed(2)}`;
            document.getElementById('totalQtdVendas').innerText = totalPedidos;
        }, (error) => {
            console.error("Erro ao carregar histórico: ", error);
            document.getElementById('tabelaHistorico').innerHTML = '<tr><td colspan="7" style="text-align: center; color: red;">Erro ao carregar dados do histórico.</td></tr>';
        });
    }

    // MOSTRAR COMPROVANTE DE IMPRESSÃO
    function abrirComprovanteImpressao(pedidoId) {
        const p = historicoVendasCache.find(item => item.id === pedidoId);
        if (!p) return;

        let itensHtml = '';
        if (p.itens && p.itens.length > 0) {
            itensHtml = p.itens.map(i => `
                <tr>
                    <td>${i.nome}</td>
                    <td>${i.qtd}x</td>
                    <td>R$ ${Number(i.subtotal || 0).toFixed(2)}</td>
                </tr>
            `).join('');
        } else {
            itensHtml = '<tr><td colspan="3">Nenhum item listado</td></tr>';
        }

        const conteudo = `
            <p><strong>Pedido Nº:</strong> #${p.numPedido}</p>
            <p><strong>Data:</strong> ${p.data}</p>
            <p><strong>Cliente:</strong> ${p.clienteNome}</p>
            <p><strong>Vendedor:</strong> ${p.vendedor}</p>
            <p><strong>Forma de Pgto:</strong> ${p.formaPagamento}</p>
            <hr style="border: 0; border-top: 1px dashed #ccc;">
            <table style="width:100%; text-align:left; margin-bottom:10px;">
                <thead>
                    <tr><th>Item</th><th>Qtd</th><th>Total</th></tr>
                </thead>
                <tbody>${itensHtml}</tbody>
            </table>
            <hr style="border: 0; border-top: 1px dashed #ccc;">
            <h3 style="text-align:right; margin:5px 0;">Total: R$ ${Number(p.total || 0).toFixed(2)}</h3>
        `;

        document.getElementById('conteudoReciboImpresso').innerHTML = conteudo;
        document.getElementById('modalImpressao').style.display = 'flex';
    }

    function fecharModalImpressao() {
        document.getElementById('modalImpressao').style.display = 'none';
    }

    // COMPARTILHAR VIA WHATSAPP / NATIVO
    function compartilharPedidoWhatsApp(pedidoId) {
        const p = historicoVendasCache.find(item => item.id === pedidoId);
        if (!p) return;

        let listaItens = '';
        if (p.itens && p.itens.length > 0) {
            listaItens = p.itens.map(i => `• ${i.qtd}x ${i.nome} - R$ ${Number(i.subtotal || 0).toFixed(2)}`).join('\n');
        } else {
            listaItens = '• Detalhes dos itens não disponíveis';
        }

        let mensagem = `*Distribuidora Frazão*\n` +
            `*Comprovante de Pedido #${p.numPedido}*\n` +
            `-----------------------------------\n` +
            `*Data:* ${p.data}\n` +
            `*Cliente:* ${p.clienteNome}\n` +
            `*Vendedor:* ${p.vendedor}\n` +
            `*Forma de Pgto:* ${p.formaPagamento}\n\n` +
            `*Itens do Pedido:*\n${listaItens}\n\n` +
            `*Total Final:* R$ ${Number(p.total || 0).toFixed(2)}\n` +
            `-----------------------------------\n` +
            `Obrigado pela preferência!`;

        if (navigator.share) {
            navigator.share({
                title: `Pedido #${p.numPedido}`,
                text: mensagem
            }).catch(err => console.log('Compartilhamento cancelado'));
        } else {
            const urlWhatsapp = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensagem)}`;
            window.open(urlWhatsapp, '_blank');
        }
    }

    // Inicia a leitura do histórico ao carregar a página
    window.onload = function() {
        carregarHistoricoVendas();
    };
</script>

</body>
</html>
