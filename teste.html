<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão - Distribuidora Frazão (Teste)</title>
  
  <!-- Rastreador de erros para capturar falhas no celular -->
  <script>
    window.onerror = function(msg, url, line) {
        alert("Erro travando o celular na linha " + line + ": " + msg);
        return true;
    };
  </script>

  <!-- Scripts do Firebase v9 (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary-color: #1e3a8a;
      --secondary-color: #2563eb;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --danger-color: #dc2626;
      --success-color: #16a34a;
      --warning-color: #d97706;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 8px; font-size: 0.95rem; }

    /* TELA DE LOGIN */
    #login-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 15px;
    }
    .login-card {
      background: var(--card-bg); padding: 22px; border-radius: 12px; width: 100%; max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;
    }
    .login-card h2 { color: var(--primary-color); margin-bottom: 12px; font-size: 1.3rem; }
    .login-card .form-group { margin-bottom: 12px; text-align: left; }

    /* APLICAÇÃO PRINCIPAL */
    #app-container { display: none; max-width: 1200px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; background: var(--primary-color); color: white; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    header h1 { font-size: 1.15rem; font-weight: bold; }
    .role-container { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.15); padding: 5px 10px; border-radius: 6px; flex-wrap: wrap; }

    .btn { padding: 7px 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.8rem; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-primary { background: var(--secondary-color); color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger { background: var(--danger-color); color: white; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-warning { background: var(--warning-color); color: white; }

    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.8rem; font-weight: bold; color: #475569; }
    input, select { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.85rem; outline: none; width: 100%; }
    input:focus, select:focus { border-color: var(--secondary-color); }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="login-screen">
    <div class="login-card">
      <h2>Distribuidora Frazão</h2>
      <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 15px;">Faça login para acessar o sistema</p>
      
      <div class="form-group">
        <label for="loginTipo">Entrar como:</label>
        <select id="loginTipo" onchange="alternarCamposLogin()">
          <option value="admin">Administrador Master</option>
          <option value="vendedor">Vendedor Cadastrado</option>
        </select>
      </div>

      <div class="form-group" id="grupoSelectVendedorLogin" style="display: none;">
        <label for="loginVendedorSelect">Selecione o Vendedor:</label>
        <select id="loginVendedorSelect" style="width: 100%;"></select>
      </div>

      <div class="form-group">
        <label for="loginSenha">Senha de Acesso:</label>
        <input type="password" id="loginSenha" placeholder="Digite sua senha" style="width: 100%;">
      </div>

      <button type="button" class="btn btn-primary" style="width: 100%; padding: 10px; margin-top: 5px;" onclick="fazerLogin()">Entrar no Sistema</button>
    </div>
  </div>

  <!-- APLICAÇÃO PRINCIPAL -->
  <div id="app-container">
    <header>
      <h1>Distribuidora Frazão</h1>
      <div class="role-container">
        <span id="labelUsuarioLogado" style="font-weight: bold; font-size: 0.85rem;"></span>
        <button class="btn btn-warning" onclick="abrirModalAlterarSenha()" id="btnAltSenha" style="padding: 4px 7px; font-size: 0.75rem;">Alterar Senha</button>
        <button class="btn btn-danger" onclick="fazerLogout()" style="padding: 4px 7px; font-size: 0.75rem;">Sair</button>
      </div>
    </header>
  </div>

  <script>
    // Configuração do Firebase (Caso seu arquivo original já tenha a inicialização do Firebase, ela será usada aqui)
    // Se precisar colar sua configuração exata do Firebase, basta colocar aqui em cima.

    // Função para alternar a exibição do select de vendedores
    function alternarCamposLogin() {
      const tipo = document.getElementById('loginTipo').value;
      const grupoVendedor = document.getElementById('grupoSelectVendedorLogin');
      if (tipo === 'vendedor') {
        grupoVendedor.style.display = 'block';
        carregarVendedoresNoLogin(); // Puxa do Firebase ao selecionar vendedor
      } else {
        grupoVendedor.style.display = 'none';
      }
    }

    // Função que busca os vendedores no Firebase e preenche o select
    function carregarVendedoresNoLogin() {
      const selectVendedor = document.getElementById('loginVendedorSelect');
      
      // Verifica se o firebase e o db já estão inicializados
      if (typeof db === 'undefined') {
        selectVendedor.innerHTML = '<option value="">Erro: Firebase não conectado</option>';
        return;
      }

      selectVendedor.innerHTML = '<option value="">Carregando vendedores...</option>';

      db.collection('vendedores').get().then((snapshot) => {
        selectVendedor.innerHTML = '<option value="">Selecione um vendedor...</option>';
        if (snapshot.empty) {
          selectVendedor.innerHTML = '<option value="">Nenhum vendedor cadastrado</option>';
          return;
        }
        snapshot.forEach((doc) => {
          const dados = doc.data();
          const nomeVendedor = dados.nome || dados.name || doc.id;
          const option = document.createElement('option');
          option.value = doc.id;
          option.textContent = nomeVendedor;
          selectVendedor.appendChild(option);
        });
      }).catch((error) => {
        console.error("Erro ao carregar vendedores:", error);
        selectVendedor.innerHTML = '<option value="">Erro ao carregar lista</option>';
      });
    }

    function fazerLogin() {
      const tipo = document.getElementById('loginTipo').value;
      const senha = document.getElementById('loginSenha').value;
      
      if (tipo === 'vendedor') {
        const vendedorId = document.getElementById('loginVendedorSelect').value;
        if (!vendedorId) {
          alert("Por favor, selecione um vendedor.");
          return;
        }
      }
      
      alert("Tentativa de login acionada para: " + tipo);
    }

    function fazerLogout() {
      alert("Logout acionado.");
    }

    function abrirModalAlterarSenha() {
      alert("Alterar senha acionado.");
    }
  </script>
</body>
</html>
