<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Gestão - Distribuidora Frazão</title>

<!-- Scripts do Firebase v9 (Compat) -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<style>
:root {
--primary-color: #1e3a8a;
--secondary-color: #2563eb;
--bg-color: #f1f5f9;
--card-bg: #ffffff;
--text-color: #0f172a;
--danger-color: #dc2626;
--success-color: #16a34a;
--warning-color: #d97706;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
body { background-color: var(--bg-color); color: var(--text-color); padding: 8px; font-size: 0.95rem; }

    /* TELA DE LOGIN */
    #login-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 15px;
    }
    .login-card {
      background: var(--card-bg); padding: 22px; border-radius: 12px; width: 100%; max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;
    }
    .login-card h2 { color: var(--primary-color); margin-bottom: 12px; font-size: 1.3rem; }
    .login-card .form-group { margin-bottom: 12px; text-align: left; }
   <!-- TELA DE LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <h2>Distribuidora Frazão</h2>
    <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 15px;">Faça login para acessar o sistema</p>
    
    <div class="form-group">
      <label for="loginTipo" style="font-size: 0.8rem; font-weight: bold; color: #475569;">Entrar como:</label>
      <select id="loginTipo" onchange="alternarCamposLogin()" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
        <option value="admin">Administrador Master</option>
        <option value="vendedor">Vendedor Cadastrado</option>
      </select>
    </div>

    <div class="form-group" id="grupoSelectVendedorLogin" style="display: none;">
      <label for="loginVendedorSelect" style="font-size: 0.8rem; font-weight: bold; color: #475569;">Selecione o Vendedor:</label>
      <select id="loginVendedorSelect" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;"></select>
    </div>

    <div class="form-group">
      <label for="loginSenha" style="font-size: 0.8rem; font-weight: bold; color: #475569;">Senha de Acesso:</label>
      <input type="password" id="loginSenha" placeholder="Digite sua senha" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
    </div>

    <button type="button" style="width: 100%; padding: 10px; margin-top: 5px; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;" onclick="fazerLogin()">Entrar no Sistema</button>
  </div>
</div>
/* APLICAÇÃO PRINCIPAL */
#app-container { display: none; max-width: 1200px; margin: 0 auto; }
