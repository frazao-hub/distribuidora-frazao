<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Bebidas | Distribuidora Frazão</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; padding-bottom: 120px; }
        h1 { text-align: center; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .loja-layout { display: flex; gap: 20px; flex-wrap: wrap; }
        .produtos-area { flex: 3; min-width: 300px; }
        
        /* Carrinho Lateral */
        .carrinho-lateral { flex: 1; min-width: 280px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: fit-content; position: sticky; top: 20px; }
        .carrinho-lateral h2 { font-size: 18px; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; color: #333; }
        .item-carrinho { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; border-bottom: 1px solid #f9f9f9; padding-bottom: 8px; }
        .item-carrinho .detalhes { flex: 1; margin-right: 10px; }
        .item-carrinho .controles { display: flex; align-items: center; gap: 5px; }
        .item-carrinho button { background: #e0e0e0; border: none; padding: 4px 8px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .item-carrinho button:hover { background: #d0d0d0; }
        .carrinho-total { font-size: 16px; font-weight: bold; margin-top: 15px; border-top: 2px solid #eee; padding-top: 10px; color: #27ae60; }
        
        .btn-limpar { background: #e74c3c; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 10px; width: 100%; font-weight: bold; }
        .btn-limpar:hover { background: #c0392b; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 140px; object-fit: contain; border-radius: 4px; background: #fff; margin-bottom: 10px; }
        .card h3 { font-size: 15px; margin: 0 0 8px 0; color: #444; }
        .card p { font-size: 16px; font-weight: bold; color: #27ae60; margin: 0 0 12px 0; }
        
        /* Botões do Card */
        .btn-add { background: #3498db; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; }
        .btn-add:hover { background: #2980b9; }
        
        .card-controles { display: flex; align-items: center; justify-content: space-between; background: #f8f9fa; border: 1px solid #ddd; border-radius: 5px; padding: 4px; }
        .card-controles button { background: #3498db; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 14px; }
        .card-controles button:hover { background: #2980b9; }
        .card-controles span { font-weight: bold; font-size: 15px; color: #333; }

        /* Paginação */
        .pagination { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .pagination button { padding: 8px 12px; border: none; background: #ddd; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .pagination button.active { background: #27ae60; color: white; }

        /* Barra Fixa do WhatsApp */
        .whatsapp-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #25d366; color: white; text-align: center; padding: 12px; font-size: 16px; font-weight: bold; box-shadow: 0 -2px 5px rgba(0,0,0,0.2); z-index: 1000; display: flex; justify-content: center; align-items: center; gap: 20px; box-sizing: border-box; }
        .whatsapp-bar a { background: white; color: #25d366; padding: 8px 16px; border-radius: 5px; text-decoration: none; font-weight: bold; }
        .whatsapp-bar a:hover { background: #f0f0f0; }

        @media (max-width: 768px) {
            .loja-layout { flex-direction: column-reverse; }
            .carrinho-lateral { position: static; width: 100%; margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bebidas</h1>
        
        <div class="loja-layout">
            <div class="produtos-area">
                <div id="product-grid" class="grid"></div>
                <div id="pagination" class="pagination"></div>
            </div>

            <div class="carrinho-lateral">
                <h2>Seu Carrinho Global</h2>
                <div id="lista-carrinho">
                    <p style="color: #888; font-size: 14px;">Nenhum produto adicionado.</p>
                </div>
                <div id="carrinho-total" class="carrinho-total" style="display: none;">
                    Total: R$ 0,00
                </div>
                <button class="btn-limpar" onclick="limparCarrinho()" id="btn-limpar-carrinho" style="display: none;">Esvaziar Carrinho</button>
            </div>
        </div>
    </div>

    <div class="whatsapp-bar">
        <span>Total: <span id="footer-total">R$ 0,00</span></span>
        <a id="btn-cotar" href="#" target="_blank">Enviar Cotação WhatsApp</a>
    </div>

    <script>
        const produtos = [
            { id: "beb_001", nome: "Acho. Pirakids c/27", preco: 45.30, imagem: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5hqX8udgW0GAvqO_NzMKR_zNouEGKhERVbgt5bRlW2A&s=10" },
            { id: "beb_002", nome: "Água mineral c/g c/12", preco: 21.00, imagem: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSM_kGydmVQ53DW2rsF8ZKZ0eUmTejHqkKPLYklEPMSww&s=10" },
            { id: "beb_003", nome: "Água mineral s/g c/12", preco: 12.90, imagem: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTJTy_WVpToD7gvozGmcsDDsuXDgB7XFGcM7DtNGksIJyxnGKTakeiy2Ek&s" },
            { id: "beb_004", nome: "Aguardente 51 und", preco: 14.10, imagem: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZ0p459lwQPImXcxfCUXiKrmz-O4P5t16-fJxCondA7w&s" },
            { id: "beb_005", nome: "Aguardente 88 und", preco: 14.50, imagem: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhIuUTlziVIJNqzvLcZ5SFuTjowC0zNOnukYQsuPy0Dw&s=10" },
            { id: "beb_006", nome: "Aguardente Jararaca und", preco: 16.50, imagem: "https://http2.mlstatic.com/D_Q_NP_2X_644625-MLB70025732871_062023-T--cachaca-jararaca-ouro-970-ml-desde-1944.webp" },
            { id: "beb_007", nome: "Cachaça cana boa c/12", preco: 35.90, imagem: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTB7cWG3NHAywI4xncbxp7HPi_w93Ofg2qozUzMol7BIQ&s=10" },
            { id: "beb_008", nome: "Cachaça caninha da roça c/12", preco: 46.80, imagem: "https://carrefourbrfood.vtexassets.com/arquivos/ids/199617/7835752_1.jpg?v=637272444333100000" },
            { id: "beb_009", nome: "Catuaba Regianni und", preco: 13.99, imagem: "https://www.extrabom.com.br/uploads/produtos/original/5535_catuaba_regiani_920ml.jpg" },
            { id: "beb_010", nome: "Conhaque Dreher und", preco: 23.40, imagem: "https://www.imigrantesbebidas.com.br/bebida/images/products/full/6001-conhaque-dreher-900ml.20230828170440.jpg" },
            { id: "beb_011", nome: "Conhaque de alcatrão und", preco: 22.00, imagem: "https://http2.mlstatic.com/D_NQ_NP_2X_753806-MLB76821423407_062024-F-conhaque-de-alcatrao-sao-joao-barra-garrafa-900ml-original.webp" },
            { id: "beb_012", nome: "Coquetel mel fort und", preco: 15.90, imagem: "" },
            { id: "beb_013", nome: "Coquetel de menta und", preco: 9.95, imagem: "" },
            { id: "beb_014", nome: "Fogo paulista und", preco: 35.40, imagem: "" },
            { id: "beb_015", nome: "Genebra und", preco: 31.90, imagem: "" },
            { id: "beb_016", nome: "Guaramor c/12", preco: 14.30, imagem: "" },
            { id: "beb_017", nome: "Guaramor c/36", preco: 35.90, imagem: "" },
            { id: "beb_018", nome: "Licor de bananinha und", preco: 25.00, imagem: "" },
            { id: "beb_019", nome: "Paratudo und", preco: 16.90, imagem: "" },
            { id: "beb_020", nome: "Pink moon 600ml c/06", preco: 45.00, imagem: "" },
            { id: "beb_021", nome: "Vinho quinado und", preco: 28.30, imagem: "" },
            { id: "beb_022", nome: "Vinho tinto suave 2l und", preco: 21.90, imagem: "" },
            { id: "beb_023", nome: "Whisky Old eight und", preco: 34.99, imagem: "" },
            { id: "beb_024", nome: "Ypióca ouro s/p und", preco: 25.99, imagem: "" }
        ];

        let paginaAtual = 1;
        const itensPorPagina = 12;
        let carrinho = JSON.parse(localStorage.getItem('carrinho_distribuidora')) || {};

        function renderizarProdutos() {
            const grid = document.getElementById("product-grid");
            grid.innerHTML = "";

            const inicio = (paginaAtual - 1) * itensPorPagina;
            const fim = inicio + itensPorPagina;
            const itensPagina = produtos.slice(inicio, fim);

            itensPagina.forEach(prod => {
                const card = document.createElement("div");
                card.className = "card";
                const imgTag = prod.imagem ? `<img src="${prod.imagem}" alt="${prod.nome}">` : '';
                
                const qtdNoCarrinho = carrinho[prod.id] ? carrinho[prod.id].quantidade : 0;
                
                let acaoHTML = "";
                if (qtdNoCarrinho === 0) {
                    acaoHTML = `<button class="btn-add" onclick="alterarQuantidade('${prod.id}', '${prod.nome}', ${prod.preco}, 1)">Adicionar</button>`;
                } else {
                    acaoHTML = `
                        <div class="card-controles">
                            <button onclick="alterarQuantidade('${prod.id}', '${prod.nome}', ${prod.preco}, -1)">-</button>
                            <span>${qtdNoCarrinho}</span>
                            <button onclick="alterarQuantidade('${prod.id}', '${prod.nome}', ${prod.preco}, 1)">+</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${imgTag}
                    <h3>${prod.nome}</h3>
                    <p>R$ ${prod.preco.toFixed(2).replace('.', ',')}</p>
                    ${acaoHTML}
                `;
                grid.appendChild(card);
            });

            renderizarPaginacao();
        }

        function renderizarPaginacao() {
            const paginacao = document.getElementById("pagination");
            paginacao.innerHTML = "";

            const totalPaginas = Math.ceil(produtos.length / itensPorPagina);

            for (let i = 1; i <= totalPaginas; i++) {
                const btn = document.createElement("button");
                btn.innerText = i;
                if (i === paginaAtual) btn.className = "active";
                btn.onclick = () => {
                    paginaAtual = i;
                    renderizarProdutos();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                paginacao.appendChild(btn);
            }
        }

        function alterarQuantidade(id, nome, preco, delta) {
            if (!carrinho[id]) {
                if (delta > 0) {
                    carrinho[id] = { nome, preco, quantidade: delta };
                }
            } else {
                carrinho[id].quantidade += delta;
                if (carrinho[id].quantidade <= 0) {
                    delete carrinho[id];
                }
            }
            salvarESincronizar();
        }

        function limparCarrinho() {
            carrinho = {};
            salvarESincronizar();
        }

        function salvarESincronizar() {
            localStorage.setItem('carrinho_distribuidora', JSON.stringify(carrinho));
            renderizarProdutos();
            atualizarCarrinhoUI();
        }

        function atualizarCarrinhoUI() {
            const listaDiv = document.getElementById("lista-carrinho");
            const totalDiv = document.getElementById("carrinho-total");
            const btnLimpar = document.getElementById("btn-limpar-carrinho");
            const footerTotal = document.getElementById("footer-total");
            
            listaDiv.innerHTML = "";
            let valorTotal = 0;
            let temItens = false;

            const numeroWhatsApp = "5521968659086";
            let mensagem = "Olá! Gostaria de fazer a cotação dos seguintes produtos:\n\n";
            let contador = 1;

            for (let id in carrinho) {
                temItens = true;
                let item = carrinho[id];
                let subtotal = item.preco * item.quantidade;
                valorTotal += subtotal;

                const itemDiv = document.createElement("div");
                itemDiv.className = "item-carrinho";
                itemDiv.innerHTML = `
                    <div class="detalhes">
                        <strong>${item.nome}</strong><br>
                        <small>R$ ${item.preco.toFixed(2).replace('.', ',')} x ${item.quantidade}</small>
                    </div>
                    <div class="controles">
                        <button onclick="alterarQuantidade('${id}', '${item.nome}', ${item.preco}, -1)">-</button>
                        <span>${item.quantidade}</span>
                        <button onclick="alterarQuantidade('${id}', '${item.nome}', ${item.preco}, 1)">+</button>
                    </div>
                `;
                listaDiv.appendChild(itemDiv);

                mensagem += `${contador}. ${item.quantidade}x ${item.nome} - R$ ${subtotal.toFixed(2).replace('.', ',')}\n`;
                contador++;
            }

            if (!temItens) {
                listaDiv.innerHTML = '<p style="color: #888; font-size: 14px;">Nenhum produto adicionado.</p>';
                totalDiv.style.display = "none";
                btnLimpar.style.display = "none";
            } else {
                totalDiv.style.display = "block";
                btnLimpar.style.display = "block";
                totalDiv.innerText = `Total: R$ ${valorTotal.toFixed(2).replace('.', ',')}`;
            }

            footerTotal.innerText = `R$ ${valorTotal.toFixed(2).replace('.', ',')}`;
            mensagem += `\n*Valor Total: R$ ${valorTotal.toFixed(2).replace('.', ',')}*`;

            const linkEncoded = encodeURI(mensagem);
            document.getElementById("btn-cotar").href = `https://wa.me/${numeroWhatsApp}?text=${linkEncoded}`;
        }

        renderizarProdutos();
        atualizarCarrinhoUI();
    </script>

</body>
</html>
