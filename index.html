<!-- BOTÕES DAS CATEGORIAS COM EVENTO DE CLIQUE -->
<div class="categorias-grid">
    <button type="button" class="btn-categoria" onclick="mostrarCategoria('balas')">Balas e Pirulitos</button>
    <button type="button" class="btn-categoria" onclick="mostrarCategoria('doces')">Doces</button>
    <button type="button" class="btn-categoria" onclick="mostrarCategoria('higiene')">Higiene</button>
    <button type="button" class="btn-categoria" onclick="mostrarCategoria('limpeza')">Limpeza</button>
    <button type="button" class="btn-categoria" onclick="mostrarCategoria('descartaveis')">Descartáveis</button>
    <button type="button" class="btn-categoria" onclick="mostrarCategoria('papelaria')">Papelaria</button>
    <button type="button" class="btn-categoria" onclick="mostrarCategoria('mercearia')">Mercearia</button>
    <button type="button" class="btn-categoria" onclick="mostrarCategoria('bebidas')">Bebidas</button>
    <button type="button" class="btn-categoria" onclick="mostrarCategoria('biscoitos')">Biscoitos</button>
    <button type="button" class="btn-categoria" onclick="mostrarCategoria('chicletes')">Chicletes e Drops</button>
</div>

<!-- ÁREA ONDE OS PRODUTOS VÃO APARECER -->
<div id="conteudo-catalogo" style="margin-top: 30px;">
    <p id="mensagem-inicial" style="text-align: center; color: #666;">Selecione uma categoria para ver os produtos.</p>
    
    <!-- SEÇÃO BALAS (INICIALMENTE OCULTA) -->
    <div id="cat-balas" class="secao-categoria" style="display: none;">
        <!-- Cole aqui o código de Balas e Pirulitos -->
    </div>

    <!-- SEÇÃO DOCES (INICIALMENTE OCULTA) -->
    <div id="cat-doces" class="secao-categoria" style="display: none;">
        <!-- Cole aqui o código de Doces -->
    </div>

    <!-- SEÇÃO HIGIENE (INICIALMENTE OCULTA) -->
    <div id="cat-higiene" class="secao-categoria" style="display: none;">
        <!-- Cole aqui o código de Higiene -->
    </div>

    <!-- SEÇÃO MERCEARIA (INICIALMENTE OCULTA) -->
    <div id="cat-mercearia" class="secao-categoria" style="display: none;">
        <!-- Cole aqui o código de Mercearia -->
    </div>
</div>

<!-- SCRIPT PARA ABRIR O CATÁLOGO AO CLICAR -->
<script>
function mostrarCategoria(categoriaId) {
    // Esconde a mensagem inicial
    const msg = document.getElementById('mensagem-inicial');
    if (msg) msg.style.display = 'none';

    // Oculta todas as seções de categoria
    const secoes = document.querySelectorAll('.secao-categoria');
    secoes.forEach(secao => {
        secao.style.display = 'none';
    });

    // Exibe apenas a categoria clicada
    const categoriaSelecionada = document.getElementById('cat-' + categoriaId);
    if (categoriaSelecionada) {
        categoriaSelecionada.style.display = 'block';
    }
}
</script>
