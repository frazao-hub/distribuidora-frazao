<!-- Exemplo de como incluir o campo Vendedor junto aos dados do cliente no admin.html -->
<div class="form-group">
    <label for="nome_cliente">Nome / Razão Social:</label>
    <input type="text" id="nome_cliente" name="nome_cliente" class="form-control" required>
</div>

<div class="form-group">
    <label for="cpf_cnpj">CPF / CNPJ:</label>
    <input type="text" id="cpf_cnpj" name="cpf_cnpj" class="form-control" required>
</div>

<div class="form-group">
    <label for="telefone">Telefone:</label>
    <input type="text" id="telefone" name="telefone" class="form-control">
</div>

<div class="form-group">
    <label for="endereco">Endereço:</label>
    <input type="text" id="endereco" name="endereco" class="form-control">
</div>

<!-- NOVO CAMPO ADICIONADO AQUI -->
<div class="form-group">
    <label for="vendedor">Vendedor Responsável:</label>
    <select id="vendedor" name="vendedor" class="form-control" required>
        <option value="">Selecione o vendedor...</option>
        <option value="Vendedor A">Vendedor A</option>
        <option value="Vendedor B">Vendedor B</option>
        <!-- Adicione aqui os nomes reais dos vendedores da sua equipe -->
    </select>
</div>
