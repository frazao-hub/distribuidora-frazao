<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distribuidora Frazão - Mercearia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding-bottom: 60px; }
    header { background-color: #1e293b; color: #ffffff; text-align: center; padding: 20px; }
    .topo-nav { max-width: 1100px; margin: 15px auto 0; padding: 0 20px; }
    .btn-voltar { text-decoration: none; color: #2563eb; font-weight: bold; }
    .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    .produtos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .card-produto { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; text-align: center; }
    .card-produto h4 { font-size: 16px; margin: 10px 0 5px; }
    .card-produto .unidade { font-size: 12px; color: #64748b; display: block; margin-bottom: 12px; }
    .btn-add { background-color: #2563eb; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
    .carrinho-box { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 20px; height: fit-content; position: sticky; top: 20px; }
    .lista-carrinho { list-style: none; margin: 15px 0; max-height: 250px; overflow-y: auto; }
    .item-carrinho { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
    .btn-qtd { background: #e2e8f0; border: none; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-whatsapp { background-color: #25d366; color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .vazio-msg { font-size: 13px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Distribuidora Frazão</h1>
    <p>Catálogo de Mercearia - Faça sua Cotação</p>
  </header>

  <div class="topo-nav">
    <a href="index.html" class="btn-voltar">&larr; Voltar para Categorias</a>
  </div>

  <div class="container">
    <div>
      <h2 style="margin-bottom: 20px;">Produtos de Mercearia</h2>
      <div class="produtos-grid">
        <div class="card-produto">
          <div style="font-size: 36px;">🌾</div>
          <h4>Arroz 5kg</h4>
          <span class="unidade">Fardo c/ 6 un</span>
          <button class="btn-add" onclick="adicionarAoCarrinho('Arroz 5kg (Fardo c/ 6)')">+ Adicionar</button>
        </div>
        <div class="card-produto">
          <div style="font-size: 36px;">🫘</div>
          <h4>Feijão Preto 1kg</h4>
          <span class="unidade">Fardo c/ 10 un</span>
          <button class="btn-add" onclick="adicionarAoCarrinho('Feijão Preto 1kg (Fardo c/ 10)')">+ Adicionar</button>
        </div>
        <div class="card-produto">
          <div style="font-size: 36px;">🫙</div>
          <h4>Óleo de Soja 900ml</h4>
          <span class="unidade">Caixa c/ 20 un</span>
          <button class="btn-add" onclick="adicionarAoCarrinho('Óleo de Soja 900ml (Caixa c/ 20)')">+ Adicionar</button>
        </div>
        <div class="card-produto">
          <div style="font-size: 36px;">🍬</div>
          <h4>Açúcar Refinado 1kg</h4>
          <span class="unidade">Fardo c/ 10 un</span>
          <button class="btn-add" onclick="adicionarAoCarrinho('Açúcar Refinado 1kg (Fardo c/ 10)')">+ Adicionar</button>
        </div>
      </div>
    </div>

    <div class="carrinho-box">
      <h3>📋 Sua Cotação</h3>
      <ul class="lista-carrinho" id="lista-carrinho">
        <li class="vazio-msg">Nenhum item adicionado.</li>
      </ul>
      <button class="btn-whatsapp" onclick="enviarWhatsApp()">💬 Cotar via WhatsApp</button>
    </div>
  </div>

  <script>
    let carrinho = {};
    const numeroWhatsApp = "5521999999999"; // Substitua pelo seu número com DDD

    function adicionarAoCarrinho(nome) {
      carrinho[nome] = (carrinho[nome] || 0) + 1;
      atualizarCarrinho();
    }

    function alterarQtd(nome, delta) {
      if (carrinho[nome]) {
        carrinho[nome] += delta;
        if (carrinho[nome] <= 0) delete carrinho[nome];
      }
      atualizarCarrinho();
    }

    function atualizarCarrinho() {
      const listaHTML = document.getElementById("lista-carrinho");
      listaHTML.innerHTML = "";
      const chaves = Object.keys(carrinho);
      if (chaves.length === 0) {
        listaHTML.innerHTML = '<li class="vazio-msg">Nenhum item adicionado.</li>';
        return;
      }
      chaves.forEach(prod => {
        const li = document.createElement("li");
        li.className = "item-carrinho";
        li.innerHTML = `<span>${prod}</span><div><button class="btn-qtd" onclick="alterarQtd('${prod}', -1)">-</button> <span>${carrinho[prod]}</span> <button class="btn-qtd" onclick="alterarQtd('${prod}', 1)">+</button></div>`;
        listaHTML.appendChild(li);
      });
    }

    function enviarWhatsApp() {
      const chaves = Object.keys(carrinho);
      if (chaves.length === 0) return alert("Adicione ao menos um item!");
      let msg = "Olá, gostaria de cotar os itens de *Mercearia*:\n\n";
      chaves.forEach(p => msg += `• *${p}*: ${carrinho[p]} cx/fardo(s)\n`);
      window.open(`https://api.whatsapp.com/send?phone=${numeroWhatsApp}&text=${encodeURIComponent(msg)}`, "_blank");
    }
  </script>
</body>
</html>
