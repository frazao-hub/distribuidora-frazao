<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Distribuidora Frazão</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Firebase App & Firestore SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-3 md:p-6">
    <div class="max-w-4xl mx-auto bg-white p-4 md:p-6 rounded-2xl shadow-lg border border-gray-100">
        
        <!-- Cabeçalho -->
        <header class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-extrabold text-gray-800 tracking-tight">Distribuidora Frazão</h1>
            <p class="text-sm text-gray-500">Painel de Gestão e Vendas</p>
        </header>

        <!-- Menu de Cartões Clicáveis (5 Opções) -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
            
            <!-- Cartão Vendedor -->
            <button onclick="mudarAba('vendedor')" id="card-vendedor" class="card-btn flex flex-col items-center justify-center p-3 bg-gray-50 hover:bg-blue-50 border-2 border-gray-200 hover:border-blue-500 rounded-xl transition duration-200 cursor-pointer group">
                <div class="p-2.5 bg-blue-100 text-blue-600 rounded-full mb-1 group-hover:scale-110 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <span class="font-bold text-gray-700 text-xs md:text-sm group-hover:text-blue-600">Vendedor</span>
            </button>

            <!-- Cartão Clientes -->
            <button onclick="mudarAba('cliente')" id="card-cliente" class="card-btn flex flex-col items-center justify-center p-3 bg-gray-50 hover:bg-blue-50 border-2 border-gray-200 hover:border-blue-500 rounded-xl transition duration-200 cursor-pointer group">
                <div class="p-2.5 bg-indigo-100 text-indigo-600 rounded-full mb-1 group-hover:scale-110 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                </div>
                <span class="font-bold text-gray-700 text-xs md:text-sm group-hover:text-indigo-600">Clientes</span>
            </button>

            <!-- Cartão Produtos -->
            <button onclick="mudarAba('produto')" id="card-produto" class="card-btn flex flex-col items-center justify-center p-3 bg-gray-50 hover:bg-blue-50 border-2 border-gray-200 hover:border-blue-500 rounded-xl transition duration-200 cursor-pointer group">
                <div class="p-2.5 bg-purple-100 text-purple-600 rounded-full mb-1 group-hover:scale-110 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                </div>
                <span class="font-bold text-gray-700 text-xs md:text-sm group-hover:text-purple-600">Produtos</span>
            </button>

            <!-- Cartão Vender (Destaque Verde) -->
            <button onclick="mudarAba('vender')" id="card-vender" class="card-btn flex flex-col items-center justify-center p-3 bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-300 hover:border-emerald-600 rounded-xl transition duration-200 cursor-pointer group">
                <div class="p-2.5 bg-emerald-500 text-white rounded-full mb-1 group-hover:scale-110 transition shadow-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"></path></svg>
                </div>
                <span class="font-bold text-emerald-800 text-xs md:text-sm">Vender</span>
            </button>

            <!-- Cartão Histórico de Vendas -->
            <button onclick="mudarAba('historico')" id="card-historico" class="card-btn col-span-2 md:col-span-1 flex flex-col items-center justify-center p-3 bg-gray-50 hover:bg-blue-50 border-2 border-gray-200 hover:border-blue-500 rounded-xl transition duration-200 cursor-pointer group">
                <div class="p-2.5 bg-amber-100 text-amber-600 rounded-full mb-1 group-hover:scale-110 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                </div>
                <span class="font-bold text-gray-700 text-xs md:text-sm group-hover:text-amber-600">Histórico</span>
            </button>
        </div>

        <hr class="border-gray-200 mb-6">

        <!-- MENSAGEM DE STATUS -->
        <div id="mensagemStatus" class="mb-4 text-center text-sm font-semibold hidden p-3 rounded-lg"></div>

        <!-- 1. SEÇÃO CADASTRO DE VENDEDOR -->
        <div id="secao-vendedor" class="secao-conteudo">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Cadastrar Vendedor</h2>
            <form id="formVendedor" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome do Vendedor</label>
                    <input type="text" id="nomeVendedor" required class="w-full rounded-lg border border-gray-300 p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ex: João Silva">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Telefone / Observação</label>
                    <input type="text" id="obsVendedor" class="w-full rounded-lg border border-gray-300 p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ex: (21) 99999-9999">
                </div>
                <button type="submit" class="btn-submit w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                    Salvar Vendedor
                </button>
            </form>
        </div>

        <!-- 2. SEÇÃO CADASTRO DE CLIENTES -->
        <div id="secao-cliente" class="secao-conteudo hidden">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Cadastrar Cliente</h2>
            <form id="formCliente" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome / Razão Social</label>
                    <input type="text" id="nomeCliente" required class="w-full rounded-lg border border-gray-300 p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Ex: Mercearia do Bairro">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Endereço / Contato</label>
                    <input type="text" id="obsCliente" class="w-full rounded-lg border border-gray-300 p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Ex: R. Rocha, São Gonçalo">
                </div>
                <button type="submit" class="btn-submit w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                    Salvar Cliente
                </button>
            </form>
        </div>

        <!-- 3. SEÇÃO CADASTRO DE PRODUTOS (Com as 10 Categorias) -->
        <div id="secao-produto" class="secao-conteudo hidden">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Cadastrar Produto</h2>
            <form id="formProduto" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome do Produto</label>
                    <input type="text" id="nomeProduto" required class="w-full rounded-lg border border-gray-300 p-2.5 focus:ring-2 focus:ring-purple-500 focus:outline-none" placeholder="Ex: Caixa de Bombom / Fardo de Refrigerante">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Categoria (Índice)</label>
                    <select id="categoriaProduto" required class="w-full rounded-lg border border-gray-300 p-2.5 bg-white focus:ring-2 focus:ring-purple-500 focus:outline-none">
                        <option value="">Selecione uma categoria...</option>
                        <option value="Doces">Doces</option>
                        <option value="Bebidas">Bebidas</option>
                        <option value="Mercearia">Mercearia</option>
                        <option value="Papelaria">Papelaria</option>
                        <option value="Artigos de Limpeza">Artigos de Limpeza</option>
                        <option value="Descartáveis">Descartáveis</option>
                        <option value="Perfumaria">Perfumaria</option>
                        <option value="Bomboniere">Bomboniere</option>
                        <option value="Utilidades">Utilidades</option>
                        <option value="Perecíveis">Perecíveis</option>
                    </select>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Preço (R$)</label>
                        <input type="number" step="0.01" id="precoProduto" required class="w-full rounded-lg border border-gray-300 p-2.5 focus:ring-2 focus:ring-purple-500 focus:outline-none" placeholder="0,00">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Estoque / Quantidade</label>
                        <input type="text" id="estoqueProduto" class="w-full rounded-lg border border-gray-300 p-2.5 focus:ring-2 focus:ring-purple-500 focus:outline-none" placeholder="Ex: 10 fardos / 50 cx">
                    </div>
                </div>
                <button type="submit" class="btn-submit w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                    Salvar Produto
                </button>
            </form>
        </div>

        <!-- 4. SEÇÃO VENDER (NOVA VENDA) -->
        <div id="secao-vender" class="secao-conteudo hidden">
            <h2 class="text-xl font-bold text-emerald-800 mb-4">Registrar Nova Venda</h2>
            <form id="formVenda" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Cliente</label>
                    <input type="text" id="vendaCliente" required class="w-full rounded-lg border border-gray-300 p-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Nome do cliente">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Vendedor</label>
                    <input type="text" id="vendaVendedor" required class="w-full rounded-lg border border-gray-300 p-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Nome do vendedor">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Valor Total (R$)</label>
                        <input type="number" step="0.01" id="vendaValor" required class="w-full rounded-lg border border-gray-300 p-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="0,00">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Produtos Vendidos</label>
                        <input type="text" id="vendaProdutos" class="w-full rounded-lg border border-gray-300 p-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Ex: 5 caixas de doces, 2 fardos de bebidas">
                    </div>
                </div>
                <button type="submit" class="btn-submit w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
                    Confirmar e Registrar Venda
                </button>
            </form>
        </div>

        <!-- 5. SEÇÃO HISTÓRICO DE VENDAS -->
        <div id="secao-historico" class="secao-conteudo hidden">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Histórico de Vendas</h2>
            <div class="overflow-x-auto rounded-lg border border-gray-200">
                <table class="min-w-full divide-y divide-gray-200 text-sm">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left font-bold text-gray-600">Data</th>
                            <th class="px-4 py-3 text-left font-bold text-gray-600">Cliente</th>
                            <th class="px-4 py-3 text-left font-bold text-gray-600">Vendedor</th>
                            <th class="px-4 py-3 text-left font-bold text-gray-600">Produtos</th>
                            <th class="px-4 py-3 text-right font-bold text-gray-600">Valor (R$)</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaHistorico" class="bg-white divide-y divide-gray-100">
                        <!-- Vendas inseridas via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // CONFIGURAÇÃO DO FIREBASE (Insira suas chaves caso necessário)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "distribuidora-frazao.firebaseapp.com",
            projectId: "distribuidora-frazao",
            storageBucket: "distribuidora-frazao.appspot.com",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // NAVEGAÇÃO ENTRE AS ABAS
        function mudarAba(aba) {
            document.querySelectorAll('.secao-conteudo').forEach(el => el.classList.add('hidden'));
            
            document.querySelectorAll('.card-btn').forEach(btn => {
                btn.classList.remove('ring-2', 'ring-blue-500', 'ring-purple-500', 'ring-emerald-500', 'bg-blue-50', 'bg-purple-50', 'bg-emerald-100');
            });

            document.getElementById('secao-' + aba).classList.remove('hidden');

            const cardAtivo = document.getElementById('card-' + aba);
            if (aba === 'vender') {
                cardAtivo.classList.add('ring-2', 'ring-emerald-500', 'bg-emerald-100');
            } else if (aba === 'produto') {
                cardAtivo.classList.add('ring-2', 'ring-purple-500', 'bg-purple-50');
            } else {
                cardAtivo.classList.add('ring-2', 'ring-blue-500', 'bg-blue-50');
            }

            ocultarMensagem();

            if (aba === 'historico') {
                carregarHistoricoVendas();
            }
        }

        function exibirMensagem(texto, tipo = 'sucesso') {
            const msgBox = document.getElementById('mensagemStatus');
            msgBox.textContent = texto;
            msgBox.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            
            if (tipo === 'sucesso') {
                msgBox.classList.add('bg-green-100', 'text-green-800');
            } else {
                msgBox.classList.add('bg-red-100', 'text-red-800');
            }
        }

        function ocultarMensagem() {
            document.getElementById('mensagemStatus').classList.add('hidden');
        }

        // CADASTRO DE VENDEDOR
        document.getElementById('formVendedor').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('.btn-submit');
            btn.disabled = true;
            btn.textContent = "Salvando...";

            try {
                await db.collection('vendedores').add({
                    nome: document.getElementById('nomeVendedor').value,
                    observacao: document.getElementById('obsVendedor').value,
                    criadoEm: new Date().toISOString()
                });
                exibirMensagem("Vendedor cadastrado com sucesso!");
                e.target.reset();
            } catch (err) {
                exibirMensagem("Erro ao salvar vendedor: " + err.message, 'erro');
            } finally {
                btn.disabled = false;
                btn.textContent = "Salvar Vendedor";
            }
        });

        // CADASTRO DE CLIENTE
        document.getElementById('formCliente').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('.btn-submit');
            btn.disabled = true;
            btn.textContent = "Salvando...";

            try {
                await db.collection('clientes').add({
                    nome: document.getElementById('nomeCliente').value,
                    observacao: document.getElementById('obsCliente').value,
                    criadoEm: new Date().toISOString()
                });
                exibirMensagem("Cliente cadastrado com sucesso!");
                e.target.reset();
            } catch (err) {
                exibirMensagem("Erro ao salvar cliente: " + err.message, 'erro');
            } finally {
                btn.disabled = false;
                btn.textContent = "Salvar Cliente";
            }
        });

        // CADASTRO DE PRODUTO (Associado às Categorias)
        document.getElementById('formProduto').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('.btn-submit');
            btn.disabled = true;
            btn.textContent = "Salvando...";

            try {
                await db.collection('produtos').add({
                    nome: document.getElementById('nomeProduto').value,
                    categoria: document.getElementById('categoriaProduto').value,
                    preco: parseFloat(document.getElementById('precoProduto').value) || 0,
                    estoque: document.getElementById('estoqueProduto').value,
                    criadoEm: new Date().toISOString()
                });
                exibirMensagem("Produto cadastrado com sucesso!");
                e.target.reset();
            } catch (err) {
                exibirMensagem("Erro ao salvar produto: " + err.message, 'erro');
            } finally {
                btn.disabled = false;
                btn.textContent = "Salvar Produto";
            }
        });

        // REGISTRO DE VENDA
        document.getElementById('formVenda').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('.btn-submit');
            btn.disabled = true;
            btn.textContent = "Registrando Venda...";

            try {
                await db.collection('vendas').add({
                    cliente: document.getElementById('vendaCliente').value,
                    vendedor: document.getElementById('vendaVendedor').value,
                    valorTotal: parseFloat(document.getElementById('vendaValor').value) || 0,
                    produtos: document.getElementById('vendaProdutos').value,
                    criadoEm: new Date().toISOString()
                });
                exibirMensagem("Venda registrada com sucesso!");
                e.target.reset();
            } catch (err) {
                exibirMensagem("Erro ao registrar venda: " + err.message, 'erro');
            } finally {
                btn.disabled = false;
                btn.textContent = "Confirmar e Registrar Venda";
            }
        });

        // HISTÓRICO DE VENDAS
        async function carregarHistoricoVendas() {
            const tbody = document.getElementById('tabelaHistorico');
            tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-4 text-center text-gray-500">Carregando histórico...</td></tr>`;

            try {
                const snapshot = await db.collection('vendas').orderBy('criadoEm', 'desc').get();
                tbody.innerHTML = "";

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-4 text-center text-gray-500">Nenhuma venda registrada ainda.</td></tr>`;
                    return;
                }

                snapshot.forEach(doc => {
                    const v = doc.data();
                    const dataFormatada = v.criadoEm ? new Date(v.criadoEm).toLocaleString('pt-BR') : '-';
                    const valorFormatado = (v.valorTotal || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 });

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50";
                    tr.innerHTML = `
                        <td class="px-4 py-3 text-xs text-gray-500 whitespace-nowrap">${dataFormatada}</td>
                        <td class="px-4 py-3 font-medium text-gray-800">${v.cliente || '-'}</td>
                        <td class="px-4 py-3 text-gray-600">${v.vendedor || '-'}</td>
                        <td class="px-4 py-3 text-gray-600">${v.produtos || '-'}</td>
                        <td class="px-4 py-3 text-right font-bold text-emerald-600">R$ ${valorFormatado}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Erro ao carregar histórico:", err);
                tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-4 text-center text-red-500">Erro ao carregar histórico de vendas.</td></tr>`;
            }
        }

        // Iniciar na aba Vendedor por padrão
        mudarAba('vendedor');
    </script>
</body>
</html>
