<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Distribuidora Frazão</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; color: #333; }
        
        /* Modal de Login */
        #modal-login {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-box { background: white; padding: 30px; border-radius: 8px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .login-box h2 { color: #27ae60; margin-top: 0; margin-bottom: 5px; }
        .login-box p { color: #666; font-size: 13px; margin-bottom: 20px; }
        
        header { background: #1e8449; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 20px; text-transform: uppercase; }
        .perfil-badge { background: #27ae60; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
        
        /* Navegação por Abas */
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: #e0e0e0; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; color: #555; }
        .tab-btn.active { background: #1e8449; color: white; }
        
        .tab-content { display: none; background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .tab-content.active { display: block; }

        /* Formulários e UI */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #555; }
        .form-group input, .form-group select { padding: 9px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        
        .btn { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn:hover { background: #219150; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-warning { background: #f39c12; }
        .btn-warning:hover { background: #d68910; }

        .tabela-container { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #1e8449; }
        .btn-sm { padding: 4px 8px; font-size: 11px; }
    </style>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, getDocs, where, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyD8SnMWXagUVz4uVM87bc2dAakZyGGW3nM",
  authDomain: "distribuidora-frazao.firebaseapp.com",
  projectId: "distribuidora-frazao",
  storageBucket: "distribuidora-frazao.firebasestorage.app",
  messagingSenderId: "642540059204",
  appId: "1:642540059204:web:c113fa6966fd97fc20da11"
};
// Initialize Firebase
const app = initializeApp(firebaseConfig);
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function gerarHash(texto) {
            if (!texto) return "";
            const encoder = new TextEncoder();
            const data = encoder.encode(texto);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // --- AUTENTICAÇÃO PAINEL ADMIN ---
        window.efetuarLoginAdmin = async (e) => {
            e.preventDefault();
            const userIn = document.getElementById("loginUser").value.trim().toLowerCase();
            const passIn = document.getElementById("loginPass").value;

            if (userIn !== "admin") {
                alert("Acesso negado: Este painel é de uso exclusivo do Administrador.");
                return;
            }

            try {
                const adminRef = doc(db, "configuracoes", "adminMaster");
                const adminSnap = await getDoc(adminRef);

                if (adminSnap.exists() && adminSnap.data().hashSenha) {
                    const hashSalvo = adminSnap.data().hashSenha;
                    const hashSenhaDigitada = await gerarHash(passIn);

                    if (hashSenhaDigitada === hashSalvo) {
                        autenticarAdminSucesso();
                    } else {
                        alert("Senha incorreta para o perfil de administrador!");
                    }
                } else {
                    autenticarAdminSucesso();
                    alert("Acesso inicial concedido. Por favor, redefina a senha de Administrador no painel.");
                }
            } catch (err) {
                console.warn("Aviso ao validar com o banco de dados:", err.message);
                autenticarAdminSucesso();
            }
        };

        function autenticarAdminSucesso() {
            document.getElementById("modal-login").style.display = "none";
            document.getElementById("nomeUsuarioHeader").innerText = "Administrador Master";
            document.getElementById("badgePerfil").innerText = "ADMIN";
        }

        window.logout = () => { location.reload(); };

        // --- MANUTENÇÃO DE SENHA MASTER ---
        window.alterarSenhaMaster = async (e) => {
            e.preventDefault();
            const novaSenha = document.getElementById("novaSenhaMaster").value;
            const confirmaSenha = document.getElementById("confirmaSenhaMaster").value;

            if (novaSenha.length < 4) {
                alert("A senha deve ter no mínimo 4 caracteres.");
                return;
            }

            if (novaSenha !== confirmaSenha) {
                alert("As senhas informadas não coincidem!");
                return;
            }

            try {
                const novoHash = await gerarHash(novaSenha);
                const adminRef = doc(db, "configuracoes", "adminMaster");
                await setDoc(adminRef, { usuario: "admin", hashSenha: novoHash, ultimaAlteracao: new Date().toISOString() });
                document.getElementById("formAlterarSenhaMaster").reset();
                alert("Senha do Administrador atualizada com sucesso!");
            } catch (err) {
                alert("Erro ao alterar senha: " + err.message);
            }
        };

        // --- GESTÃO DE VENDEDORES ---
        window.cadastrarVendedor = async (e) => {
            e.preventDefault();
            const nomeVend = document.getElementById("nomeVendedorCad").value.trim();
            const userVend = document.getElementById("userVendedorCad").value.trim().toLowerCase();
            const senhaPur = document.getElementById("passVendedorCad").value;

            if (userVend === "admin") {
                alert("O usuário 'admin' é reservado.");
                return;
            }

            try {
                const hashSenha = await gerarHash(senhaPur);
                await addDoc(collection(db, "vendedores"), {
                    nome: nomeVend,
                    usuario: userVend,
                    hashSenha: hashSenha,
                    dataCadastro: new Date().toISOString()
                });
                document.getElementById("formVendedor").reset();
                alert(`Vendedor ${nomeVend} cadastrado!`);
            } catch (err) {
                alert("Erro ao cadastrar vendedor: " + err.message);
            }
        };

        onSnapshot(collection(db, "vendedores"), (snapshot) => {
            const lista = document.getElementById("listaVendedores");
            if (!lista) return;
            lista.innerHTML = "";

            if (snapshot.empty) {
                lista.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#888;">Nenhum vendedor cadastrado.</td></tr>`;
                return;
            }

            snapshot.forEach(docSnap => {
                const v = docSnap.data();
                const id = docSnap.id;
                lista.innerHTML += `
                    <tr>
                        <td><strong>${v.nome}</strong></td>
                        <td>${v.usuario}</td>
                        <td><button class="btn btn-sm btn-danger" onclick="excluirVendedor('${id}')">Remover</button></td>
                    </tr>
                `;
            });
        });

        window.excluirVendedor = async (id) => {
            if(confirm("Deseja excluir este vendedor do sistema?")) {
                await deleteDoc(doc(db, "vendedores", id));
            }
        };

        // --- HISTÓRICO E RELATÓRIOS ---
        onSnapshot(query(collection(db, "vendas"), orderBy("data", "desc")), (snapshot) => {
            const lista = document.getElementById("listaHistoricoVendas");
            if (!lista) return;
            lista.innerHTML = "";
            let totalMes = 0;
            const mesAtual = new Date().getMonth();

            snapshot.forEach(docSnap => {
                const v = docSnap.data();
                const dataVenda = new Date(v.data);

                if (dataVenda.getMonth() === mesAtual) {
                    totalMes += v.total;
                }

                lista.innerHTML += `
                    <tr>
                        <td><strong>#${v.numeroPedido || '-'}</strong></td>
                        <td>${dataVenda.toLocaleString()}</td>
                        <td>${v.vendedor || '-'}</td>
                        <td>${(v.formaPagto || '').toUpperCase()}</td>
                        <td>R$ ${parseFloat(v.total || 0).toFixed(2)}</td>
                    </tr>
                `;
            });

            document.getElementById("fechamentoMensalDisplay").innerText = totalMes.toFixed(2);
        });

        // --- NAVEGAÇÃO ---
        window.mudarAba = (abaId, evt) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            document.getElementById('tab-' + abaId).classList.add('active');
            if (evt && evt.target) evt.target.classList.add('active');
        };
    </script>
</head>
<body>

    <!-- MODAL DE LOGIN ADMIN -->
    <div id="modal-login">
        <div class="login-box">
            <h2>Painel Admin</h2>
            <p>Distribuidora Frazão</p>
            <form onsubmit="efetuarLoginAdmin(event)">
                <div class="form-group" style="margin-bottom: 10px;">
                    <input type="text" id="loginUser" value="admin" placeholder="Usuário Admin" required readonly style="background:#e9ecef;">
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <input type="password" id="loginPass" placeholder="Senha do Administrador" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn" style="width: 100%; background: #1e8449;">Acessar Painel Admin</button>
            </form>
        </div>
    </div>

    <!-- CABEÇALHO -->
    <header>
        <h1>Distribuidora Frazão — Administração</h1>
        <div>
            <span id="nomeUsuarioHeader" style="margin-right:10px; font-weight:bold;"></span>
            <span class="perfil-badge" id="badgePerfil">...</span>
            <button onclick="logout()" class="btn btn-sm btn-danger" style="margin-left:10px;">Sair</button>
        </div>
    </header>

    <div class="container">

        <!-- NAVEGAÇÃO -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="mudarAba('vendedores', event)">Gestão de Vendedores & Senha</button>
            <button class="tab-btn" onclick="mudarAba('historico', event)">Relatório & Fechamento de Vendas</button>
        </div>

        <!-- ABA 1: VENDEDORES & CONFIGURAÇÃO -->
        <div id="tab-vendedores" class="tab-content active">
            <h2>Cadastrar Novo Vendedor</h2>
            <form id="formVendedor" onsubmit="cadastrarVendedor(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nome Completo</label>
                        <input type="text" id="nomeVendedorCad" required>
                    </div>
                    <div class="form-group">
                        <label>Usuário de Acesso</label>
                        <input type="text" id="userVendedorCad" required>
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="passVendedorCad" required>
                    </div>
                </div>
                <button type="submit" class="btn">Salvar Vendedor</button>
            </form>

            <h3 style="margin-top:25px;">Vendedores Registrados</h3>
            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Usuário</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="listaVendedores"></tbody>
                </table>
            </div>

            <hr style="margin: 30px 0;">

            <h2>Segurança: Alterar Senha Admin Master</h2>
            <form id="formAlterarSenhaMaster" onsubmit="alterarSenhaMaster(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nova Senha Admin</label>
                        <input type="password" id="novaSenhaMaster" required>
                    </div>
                    <div class="form-group">
                        <label>Confirmar Nova Senha</label>
                        <input type="password" id="confirmaSenhaMaster" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-warning">Atualizar Senha Principal</button>
            </form>
        </div>

        <!-- ABA 2: HISTÓRICO -->
        <div id="tab-historico" class="tab-content">
            <h2>Relatório de Vendas</h2>
            <div style="background: #eef9f1; padding: 15px; border-radius: 6px; margin-bottom: 15px;">
                <h3 style="margin:0;">Faturamento do Mês: R$ <span id="fechamentoMensalDisplay">0.00</span></h3>
            </div>
            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Pedido</th>
                            <th>Data/Hora</th>
                            <th>Vendedor</th>
                            <th>Pagamento</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="listaHistoricoVendas"></tbody>
                </table>
            </div>
        </div>

    </div>

</body>
</html>
