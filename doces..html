<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Doces - Distribuidora Frazão</title>
    <style>
        :root {
            --primary-color: #d32f2f;
            --whatsapp-color: #25d366;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px;
        }

        /* Menu Superior entre Categorias */
        nav {
            background: #ffffff;
            padding: 12px 10px;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            margin: 0 8px;
            font-weight: 600;
            color: #555;
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
        }

        nav a:hover {
            color: var(--primary-color);
        }

        nav a.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 0.9rem;
        }

        /* Barra de Busca */
        .search-box {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        .search-box input {
            width: 100%;
            max-width: 500px;
            padding: 10px 18px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
        }

        .products-count {
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: #666;
        }

        /* GRID FIXO EM 4 COLUNAS (com adaptação para telas menores) */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        @media (max-width: 992px) { .products-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .products-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .products-grid { grid-template-columns: 1fr; } }

        /* Estilo do Card do Catálogo */
        .product-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #e0e0e0;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .product-thumb {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .product-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #222;
            margin-bottom: 12px;
            text-transform: capitalize;
            min-height: 2.6em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .btn-add {
            background-color: #f0f0f0;
            color: #333;
            border: none;
            border-radius: 6px;
            padding: 8px 6px;
            font-size: 0.78rem;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            transition: background 0.2s;
        }

        .btn-add:hover { background-color: #e0e0e0; }
        .btn-add.added { background-color: #4caf50; color: white; }

        .btn-direct-quote {
            background-color: var(--whatsapp-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 6px;
            font-size: 0.78rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            flex: 1;
        }

        .btn-direct-quote:hover { background-color: #1eb954; }

        /* Estilo da Paginação */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .page-btn {
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .page-btn:hover { background-color: #eee; }
        .page-btn.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Barra de Cotação Fixa */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #ffffff;
            box-shadow: 0 -3px 12px rgba(0,0,0,0.15);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .cart-info { font-size: 0.95rem; font-weight: bold; color: #333; }

        .btn-whatsapp-cart {
            background-color: var(--whatsapp-color);
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-whatsapp-cart:hover { background-color: #1eb954; }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px;
            color: #888;
            display: none;
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Início</a> |
    <a href="doces.html" class="active">Doces</a> |
    <a href="bebidas.html">Bebidas</a> |
    <a href="mercearia.html">Mercearia</a> |
    <a href="limpeza.html">Higiene & Limpeza</a> |
    <a href="papelaria.html">Papelaria</a>
</nav>

<div class="container">
    <header>
        <h1>Catálogo de Doces</h1>
        <p>Distribuidora Frazão — Selecione os produtos para cotar no WhatsApp</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Buscar doce (ex: Fini, Mariola, Paçoca)...">
    </div>

    <div class="products-count" id="productsCount">Carregando catálogo...</div>

    <!-- Grid configurada em 4 Colunas -->
    <main class="products-grid" id="productList">
        <div class="no-results" id="noResults">Nenhum produto encontrado.</div>
    </main>

    <!-- Controles de Paginação -->
    <div class="pagination" id="pagination"></div>
</div>

<div class="cart-bar">
    <div class="cart-info">
        <span id="cartCount">0</span> item(ns) na lista
    </div>
    <button class="btn-whatsapp-cart" onclick="sendCartToWhatsApp()">
        Cotar Lista no WhatsApp
    </button>
</div>

<script>
    const whatsappNumber = "5521968659086"; 

    const doces = [
        "bananinha cremosa famoso", "baton preto", "bombom serenata", "cajuzinho",
        "chup-chup biba", "cocada Aurora", "crokissimo", "disqueti",
        "doce de abóbora", "doce de amendoim 1,5 kg", "doce de amendoim 1,65 kg", "doce de amendoim liso Aurora",
        "doce de leite", "doce de leite ninho", "famoso beijinho de coco", "famoso beijinho goiabada",
        "famoso brigadeiro", "geladão gel fruta", "geladinho gel fruta", "geleia Aurora",
        "goma docile eucalipto", "goma fini amora", "goma fini angry", "goma fini banana",
        "goma fini beijinho", "goma fini dentadura", "goma fini minhoca", "goma fini morango",
        "goma fini morango cítrico", "goma fini pinta língua", "goma fini sortido", "goma fini tutti frutti",
        "goma fini twister", "goma fini twister ácido", "goma fini ursinho", "goma fini uva",
        "goma fini uva cítrico", "goma mini sortida c/24", "goma tubo Dori", "grelhaditos c/30",
        "mariola 2,5kg", "mariola 3,0kg", "mariola açucarada", "mariola lisa 800g",
        "mendorato c/30", "nucita chocolate", "nucita morango", "nucita napolitano c/24",
        "nucita sortida", "paçoca rolha santa helena", "paçocao", "pé de moça",
        "pezão", "pingo de leite", "quebra queixão"
    ];

    let cart = [];
    let currentFiltered = [...doces];
    let currentPage = 1;
    const itemsPerPage = 12; // Exibe 12 produtos por página (3 linhas de 4 colunas)

    const productList = document.getElementById('productList');
    const productsCount = document.getElementById('productsCount');
    const noResults = document.getElementById('noResults');
    const cartCount = document.getElementById('cartCount');
    const paginationEl = document.getElementById('pagination');

    function renderPage(page) {
        currentPage = page;
        productList.innerHTML = '';
        productList.appendChild(noResults);

        if (currentFiltered.length === 0) {
            noResults.style.display = 'block';
            productsCount.innerText = 'Nenhum doce encontrado';
            paginationEl.innerHTML = '';
            return;
        }

        noResults.style.display = 'none';
        
        const start = (page - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageItems = currentFiltered.slice(start, end);

        productsCount.innerText = `Exibindo ${start + 1}-${Math.min(end, currentFiltered.length)} de ${currentFiltered.length} doce(s)`;

        pageItems.forEach(item => {
            const isAdded = cart.includes(item);
            const card = document.createElement('article');
            card.className = 'product-card';
            card.innerHTML = `
                <div class="product-thumb">🍬</div>
                <div class="product-info">
                    <h2 class="product-title">${item}</h2>
                    <div class="actions">
                        <button class="btn-add ${isAdded ? 'added' : ''}" onclick="toggleCart('${item}', this)">
                            ${isAdded ? 'Remover' : 'Adicionar'}
                        </button>
                        <button class="btn-direct-quote" onclick="quoteSingleProduct('${item}')">
                            Cotar
                        </button>
                    </div>
                </div>
            `;
            productList.appendChild(card);
        });

        renderPagination();
    }

    function renderPagination() {
        paginationEl.innerHTML = '';
        const totalPages = Math.ceil(currentFiltered.length / itemsPerPage);

        if (totalPages <= 1) return;

        const prevBtn = document.createElement('button');
        prevBtn.className = 'page-btn';
        prevBtn.innerText = '« Anterior';
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => renderPage(currentPage - 1);
        paginationEl.appendChild(prevBtn);

        for (let i = 1; i <= totalPages; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            pageBtn.innerText = i;
            pageBtn.onclick = () => renderPage(i);
            paginationEl.appendChild(pageBtn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.className = 'page-btn';
        nextBtn.innerText = 'Próximo »';
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => renderPage(currentPage + 1);
        paginationEl.appendChild(nextBtn);
    }

    function toggleCart(productName, btn) {
        const index = cart.indexOf(productName);
        if (index > -1) {
            cart.splice(index, 1);
            btn.innerText = "Adicionar";
            btn.classList.remove("added");
        } else {
            cart.push(productName);
            btn.innerText = "Remover";
            btn.classList.add("added");
        }
        cartCount.innerText = cart.length;
    }

    function quoteSingleProduct(productName) {
        const message = `Olá! Gostaria de consultar o preço e a disponibilidade do item:\n- *${productName}*`;
        const url = `https://api.whatsapp.com/send?phone=${whatsappNumber}&text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }

    function sendCartToWhatsApp() {
        if (cart.length === 0) {
            alert("Por favor, selecione ao menos um doce clicando em 'Adicionar' antes de cotar.");
            return;
        }

        let message = "Olá! Gostaria de fazer uma cotação para os seguintes itens da categoria *Doces*:\n\n";
        cart.forEach(item => {
            message += `• ${item}\n`;
        });

        const url = `https://api.whatsapp.com/send?phone=${whatsappNumber}&text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }

    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        currentFiltered = doces.filter(item => item.toLowerCase().includes(query));
        renderPage(1);
    }

    renderPage(1);
</script>

</body>
</html>
