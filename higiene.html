<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higiene - Distribuidora Frazão</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); padding: 24px 16px; max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 32px; padding-bottom: 16px; border-bottom: 2px solid var(--border); }
        header h1 { color: var(--primary); font-size: 28px; margin-bottom: 8px; }

        .admin-panel { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 32px; box-shadow: var(--shadow); }
        .admin-panel h2 { font-size: 18px; color: var(--primary); margin-bottom: 16px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; font-weight: 600; }
        .form-group input { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: var(--primary); }
        
        .btn-add { background-color: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; transition: background-color 0.2s; }
        .btn-add:hover { background-color: var(--primary-hover); }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 32px; min-height: 400px; }
        .product-card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between; }
        .product-info-wrapper { display: flex; align-items: center; gap: 16px; }
        
        .product-icon { width: 70px; height: 70px; border-radius: 8px; background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; border: 1px solid var(--border); }
        .product-icon img { width: 100%; height: 100%; object-fit: contain; }
        .product-icon .emoji-fallback { font-size: 30px; }
        .product-info h3 { font-size: 16px; margin-bottom: 4px; }
        
        .product-actions { display: flex; justify-content: flex-end; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
        .btn-delete { background: none; border: none; color: #ef4444; font-size: 13px; cursor: pointer; padding: 4px 8px; border-radius: 4px; }
        .btn-delete:hover { background-color: #fef2f2; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 24px; }
        .page-btn { background-color: var(--card-bg); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; color: var(--text-dark); }
        .page-btn.active { background-color: var(--primary); color: white; border-color: var(--primary); }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <h1>Catálogo de Higiene e Limpeza</h1>
        <p>Distribuidora Frazão — Gestão de Produtos</p>
    </header>

    <section class="admin-panel">
        <h2>📦 Adicionar Novo Produto com Foto</h2>
        <form id="productForm" onsubmit="adicionarProduto(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label for="nomeProduto">Nome do Produto</label>
                    <input type="text" id="nomeProduto" placeholder="Ex: Absorvente Intimus Gel" required>
                </div>

                <div class="form-group">
                    <label for="precoProduto">Preço (R$)</label>
                    <input type="text" id="precoProduto" placeholder="Ex: 12,50">
                </div>

                <div class="form-group" style="grid-column: span 2;">
                    <label for="linkImagem">Link da Imagem da Internet (URL)</label>
                    <input type="url" id="linkImagem" placeholder="Cole o link da foto da internet aqui">
                </div>
            </div>

            <button type="submit" class="btn-add">➕ Adicionar Produto</button>
        </form>
    </section>

    <main>
        <div class="products-grid" id="productsGrid"></div>
        <div class="pagination" id="pagination"></div>
    </main>

    <script>
        let produtos = [
            { nome: 'Absorvente Intimus Gel', preco: ''https:// '' },
            { nome: 'Acetonas', preco: '', imagem: '' },
            { nome: 'Água Oxigenada', preco: '', imagem: '' },
            { nome: 'Algodão', preco: '', imagem: '' },
            { nome: 'Amônia', preco: '', imagem: '' },
            { nome: 'Aparelhos de Barbear', preco: '', imagem: '' },
            { nome: 'Band-Aid', preco: '', imagem: '' },
            { nome: 'Chupeta de Silicone', preco: '', imagem: '' },
            { nome: 'Cotonetes Nathy', preco: '', imagem: '' },
            { nome: 'Creme Dental Oral-B', preco: '', imagem: '' },
            { nome: 'Descolorantes', preco: '', imagem: '' },
            { nome: 'Desodorante Leite de Rosas', preco: '', imagem: '' },
            { nome: 'Escova de Dente Condor', preco: '', imagem: '' },
            { nome: 'Escova de Dente Pata-Pata', preco: '', imagem: '' },
            { nome: 'Lâminas de Barbear', preco: '', imagem: '' },
            { nome: 'Papel Higiênico', preco: '', imagem: '' },
            { nome: 'Pentes', preco: '', imagem: '' },
            { nome: 'Pinça Merheje', preco: '', imagem: '' },
            { nome: 'Produtos para Unhas', preco: '', imagem: '' },
            { nome: 'Rala Calo', preco: '', imagem: '' },
            { nome: 'Sabonete Francis', preco: '', imagem: '' },
            { nome: 'Sabonete Lux', preco: '', imagem: '' },
            { nome: 'Sabonetes Diversos', preco: '', imagem: '' }
        ];

        const itensPorPagina = 8;
        let paginaAtual = 1;

        function renderizarProdutos() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            const inicio = (paginaAtual - 1) * itensPorPagina;
            const fim = inicio + itensPorPagina;
            const produtosPagina = produtos.slice(inicio, fim);

            produtosPagina.forEach((p, index) => {
                const indexReal = inicio + index;
                const card = document.createElement('div');
                card.className = 'product-card';
                
                let iconeHTML = p.imagem && p.imagem.trim() !== "" 
                    ? `<img src="${p.imagem}" alt="${p.nome}" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\'emoji-fallback\'>📦</span>';">`
                    : `<span class="emoji-fallback">🧴</span>`;

                card.innerHTML = `
                    <div class="product-info-wrapper">
                        <div class="product-icon">${iconeHTML}</div>
                        <div class="product-info">
                            <h3>${p.nome}</h3>
                            ${p.preco ? `<div style="font-weight:700; color:#10b981;">R$ ${p.preco}</div>` : ''}
                        </div>
                    </div>
                    <div class="product-actions">
                        <button class="btn-delete" onclick="removerProduto(${indexReal})">Excluir</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            renderizarPaginacao();
        }

        function renderizarPaginacao() {
            const paginationEl = document.getElementById('pagination');
            paginationEl.innerHTML = '';

            const totalPaginas = Math.ceil(produtos.length / itensPorPagina);

            const btnPrev = document.createElement('button');
            btnPrev.className = 'page-btn';
            btnPrev.innerText = '«';
            btnPrev.disabled = paginaAtual === 1;
            btnPrev.onclick = () => { paginaAtual--; renderizarProdutos(); };
            paginationEl.appendChild(btnPrev);

            for (let i = 1; i <= totalPaginas; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === paginaAtual ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => { paginaAtual = i; renderizarProdutos(); };
                paginationEl.appendChild(btn);
            }

            const btnNext = document.createElement('button');
            btnNext.className = 'page-btn';
            btnNext.innerText = '»';
            btnNext.disabled = paginaAtual === totalPaginas;
            btnNext.onclick = () => { paginaAtual++; renderizarProdutos(); };
            paginationEl.appendChild(btnNext);
        }

        function adicionarProduto(event) {
            event.preventDefault();
            const nome = document.getElementById('nomeProduto').value;
            const preco = document.getElementById('precoProduto').value;
            const imagem = document.getElementById('linkImagem').value;

            produtos.unshift({ nome, preco, imagem });
            document.getElementById('productForm').reset();
            paginaAtual = 1;
            renderizarProdutos();
        }

        function removerProduto(index) {
            produtos.splice(index, 1);
            const totalPaginas = Math.ceil(produtos.length / itensPorPagina);
            if (paginaAtual > totalPaginas && totalPaginas > 0) {
                paginaAtual = totalPaginas;
            }
            renderizarProdutos();
        }

        renderizarProdutos();
    </script>
</body>
</html>
