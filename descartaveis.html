<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Descartáveis | Distribuidora Frazão</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; padding-bottom: 120px; }
        h1 { text-align: center; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        .voltar { display: inline-block; margin-bottom: 10px; color: #27ae60; text-decoration: none; font-weight: bold; }

        .loja-layout { display: flex; gap: 20px; flex-wrap: wrap; }
        .produtos-area { flex: 3; min-width: 300px; }

        /* Carrinho e Cliente Lateral */
        .carrinho-lateral { flex: 1; min-width: 300px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: fit-content; position: sticky; top: 20px; }
        .carrinho-lateral h2 { font-size: 18px; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; color: #333; }
        
        /* Bloco de Cadastro de Cliente Destacado */
        .bloco-cliente { background: #e8f8f0; border: 2px solid #27ae60; border-radius: 6px; padding: 15px; margin-bottom: 20px; }
        .bloco-cliente h3 { margin: 0 0 10px 0; font-size: 15px; color: #27ae60; border-bottom: 1px solid #d4efdf; padding-bottom: 6px; }
        .form-grupo { margin-bottom: 10px; }
        .form-grupo label { display: block; font-weight: bold; margin-bottom: 3px; font-size: 13px; color: #333; }
        .form-grupo input, .form-grupo textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; background: #fff; }
        .btn-salvar-cliente { background: #27ae60; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 5px; }
        .btn-salvar-cliente:hover { background: #219653; }
        
        .cliente-resumo { font-size: 13px; line-height: 1.5; color: #333; }
        .btn-editar-cliente { background: #e67e22; color: white; border: none; padding: 6px; width: 100%; border-radius: 4px; font-weight: bold; font-size: 12px; cursor: pointer; margin-top: 8px; }
        .btn-editar-cliente:hover { background: #d35400; }

        .item-carrinho { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; border-bottom: 1px solid #f9f9f9; padding-bottom: 8px; }
        .item-carrinho .detalhes { flex: 1; margin-right: 10px; }
        .item-carrinho .controles { display: flex; align-items: center; gap: 5px; }
        .item-carrinho button { background: #e0e0e0; border: none; padding: 4px 8px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .carrinho-total { font-size: 16px; font-weight: bold; margin-top: 15px; border-top: 2px solid #eee; padding-top: 10px; color: #27ae60; }

        .btn-limpar { background: #e74c3c; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 10px; width: 100%; font-weight: bold; }
        .btn-limpar:hover { background: #c0392b; }

        /* Grid de Produtos */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 140px; object-fit: contain; border-radius: 4px; background: #fff; margin-bottom: 10px; }
        .card h3 { font-size: 15px; margin: 0 0 8px 0; color: #444; }
        .card p { font-size: 16px; font-weight: bold; color: #27ae60; margin: 0 0 12px 0; }

        .btn-add { background: #3498db; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; }
        .btn-add:hover { background: #2980b9; }

        .card-controles { display: flex; align-items: center; justify-content: space-between; background: #f8f9fa; border: 1px solid #ddd; border-radius: 5px; padding: 4px; }
        .card-controles button { background: #3498db; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 14px; }
        .card-controles span { font-weight: bold; font-size: 15px; color: #333; }

        .pagination { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .pagination button { padding: 8px 12px; border: none; background: #ddd; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .pagination button.active { background: #27ae60; color: white; }

        .whatsapp-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #25d366; color: white; text-align: center; padding: 12px; font-size: 16px; font-weight: bold; box-shadow: 0 -2px 5px rgba(0,0,0,0.2); z-index: 1000; display: flex; justify-content: center; align-items: center; gap: 20px; box-sizing: border-box; }
        .whatsapp-bar a { background: white; color: #25d366; padding: 8px 16px; border-radius: 5px; text-decoration: none; font-weight: bold; }
        .whatsapp-bar a:hover { background: #f0f0f0; }

        @media (max-width: 768px) {
            .loja-layout { flex-direction: column-reverse; }
            .carrinho-lateral { position: static; width: 100%; margin-bottom: 20px; }
        }
    </style>
</head>

            { id: "des_036", nome: "Sacola REF 40x50 3kg", preco: 59.00, imagem: "" }
        ];

        let paginaAtual = 1;
        const itensPorPagina = 12;

        function escaparHTML(texto) {
            return String(texto).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        // Validação oficial de CPF
        function validarCPF(cpf) {
            cpf = cpf.replace(/[^\d]/g, '');
            if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
            let soma = 0, resto;
            for (let i = 1; i <= 9; i++) soma += parseInt(cpf.substring(i-1, i)) * (11 - i);
            resto = (soma * 10) % 11;
            if ((resto === 10) || (resto === 11)) resto = 0;
            if (resto !== parseInt(cpf.substring(9, 10))) return false;
            soma = 0;
            for (let i = 1; i <= 10; i++) soma += parseInt(cpf.substring(i-1, i)) * (12 - i);
            resto = (soma * 10) % 11;
            if ((resto === 10) || (resto === 11)) resto = 0;
            return resto === parseInt(cpf.substring(10, 11));
        }

        // Validação oficial de CNPJ
        function validarCNPJ(cnpj) {
            cnpj = cnpj.replace(/[^\d]/g, '');
            if (cnpj.length !== 14 || /^(\d)\1+$/.test(cnpj)) return false;
            let tamanho = cnpj.length - 2;
            let numeros = cnpj.substring(0, tamanho);
            let digitos = cnpj.substring(tamanho);
            let soma = 0, pos = tamanho - 7;
            for (let i = tamanho; i >= 1; i--) {
                soma += numeros.charAt(tamanho - i) * pos--;
                if (pos < 2) pos = 9;
            }
            let resultado = soma % 11 < 2 ? 0 : 11 - (soma % 11);
            if (resultado !== parseInt(digitos.charAt(0))) return false;
            tamanho = tamanho + 1;
            numeros = cnpj.substring(0, tamanho);
            soma = 0;
            pos = tamanho - 7;
            for (let i = tamanho; i >= 1; i--) {
                soma += numeros.charAt(tamanho - i) * pos--;
                if (pos < 2) pos = 9;
            }
            resultado = soma % 11 < 2 ? 0 : 11 - (soma % 11);
            return resultado === parseInt(digitos.charAt(1));
        }

        function salvarCliente(event) {
            event.preventDefault();
            const docBruto = document.getElementById('cli-documento').value;
            const docLimpo = docBruto.replace(/[^\d]/g, '');

            let documentoValido = false;
            if (docLimpo.length === 11) {
                documentoValido = validarCPF(docLimpo);
            } else if (docLimpo.length === 14) {
                documentoValido = validarCNPJ(docLimpo);
            }

            if (!documentoValido) {
                alert("CPF ou CNPJ inválido! Por favor, insira um documento real e correto para continuar.");
                document.getElementById('cli-documento').focus();
                return;
            }

            cliente = {
                nome: document.getElementById('cli-nome').value.trim(),
                documento: docBruto.trim(),
                telefone: document.getElementById('cli-telefone').value.trim(),
                endereco: document.getElementById('cli-endereco').value.trim()
            };

            localStorage.setItem('cliente_distribuidora', JSON.stringify(cliente));
            atualizarInterfaceCliente();
            alert("Cadastro salvo com sucesso!");
        }

        function atualizarInterfaceCliente() {
            const form = document.getElementById('form-cliente');
            const resumo = document.getElementById('resumo-cliente');

            if (cliente && cliente.nome && cliente.documento) {
                document.getElementById('res-nome').innerText = cliente.nome;
                document.getElementById('res-doc').innerText = cliente.documento;
                document.getElementById('res-tel').innerText = cliente.telefone;
                document.getElementById('res-end').innerText = cliente.endereco;

                form.style.display = 'none';
                resumo.style.display = 'block';
            } else {
                form.style.display = 'block';
                resumo.style.display = 'none';
            }
            atualizarCarrinhoUI();
        }

        function editarCliente() {
            document.getElementById('cli-nome').value = cliente.nome || '';
            document.getElementById('cli-documento').value = cliente.documento || '';
            document.getElementById('cli-telefone').value = cliente.telefone || '';
            document.getElementById('cli-endereco').value = cliente.endereco || '';

            document.getElementById('form-cliente').style.display = 'block';
            document.getElementById('resumo-cliente').style.display = 'none';
        }

        function renderizarProdutos() {
            const grid = document.getElementById("product-grid");
            grid.innerHTML = "";

            const inicio = (paginaAtual - 1) * itensPorPagina;
            const itensPagina = produtos.slice(inicio, inicio + itensPorPagina);

            itensPagina.forEach(prod => {
                const card = document.createElement("div");
                card.className = "card";
                const imgTag = prod.imagem ? `<img src="${prod.imagem}" alt="${escaparHTML(prod.nome)}">` : '';
                const qtd = carrinho[prod.id] ? carrinho[prod.id].quantidade : 0;
                const nomeJS = prod.nome.replace(/'/g, "\\'");

                let acaoHTML;
                if (qtd === 0) {
                    acaoHTML = `<button class="btn-add" onclick="alterarQuantidade('${prod.id}', '${nomeJS}', ${prod.preco}, 1)">Adicionar</button>`;
                } else {
                    acaoHTML = `
                        <div class="card-controles">
                            <button onclick="alterarQuantidade('${prod.id}', '${nomeJS}', ${prod.preco}, -1)">-</button>
                            <span>${qtd}</span>
                            <button onclick="alterarQuantidade('${prod.id}', '${nomeJS}', ${prod.preco}, 1)">+</button>
                        </div>`;
                }

                card.innerHTML = `
                    ${imgTag}
                    <h3>${escaparHTML(prod.nome)}</h3>
                    <p>R$ ${prod.preco.toFixed(2).replace('.', ',')}</p>
                    ${acaoHTML}`;
                grid.appendChild(card);
            });

            renderizarPaginacao();
        }

        function renderizarPaginacao() {
            const paginacao = document.getElementById("pagination");
            paginacao.innerHTML = "";
            const totalPaginas = Math.ceil(produtos.length / itensPorPagina);

            for (let i = 1; i <= totalPaginas; i++) {
                const btn = document.createElement("button");
                btn.innerText = i;
                if (i === paginaAtual) btn.className = "active";
                btn.onclick = () => {
                    paginaAtual = i;
                    renderizarProdutos();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                paginacao.appendChild(btn);
            }
        }

        function alterarQuantidade(id, nome, preco, delta) {
            if (!carrinho[id]) {
                if (delta > 0) carrinho[id] = { nome, preco, quantidade: delta };
            } else {
                carrinho[id].quantidade += delta;
                if (carrinho[id].quantidade <= 0) delete carrinho[id];
            }
            salvarESincronizar();
        }

        function limparCarrinho() {
            carrinho = {};
            salvarESincronizar();
        }

        function salvarESincronizar() {
            localStorage.setItem('carrinho_distribuidora', JSON.stringify(carrinho));
            renderizarProdutos();
            atualizarCarrinhoUI();
        }

        function atualizarCarrinhoUI() {
            const listaDiv = document.getElementById("lista-carrinho");
            const totalDiv = document.getElementById("carrinho-total");
            const btnLimpar = document.getElementById("btn-limpar-carrinho");
            const footerTotal = document.getElementById("footer-total");

            listaDiv.innerHTML = "";
            let valorTotal = 0;
            let temItens = false;

            let mensagem = "*NOVO PEDIDO*\n\n";
            let contador = 1;

            for (let id in carrinho) {
                temItens = true;
                let item = carrinho[id];
                let subtotal = item.preco * item.quantidade;
                valorTotal += subtotal;

                const itemDiv = document.createElement("div");
                itemDiv.className = "item-carrinho";
                itemDiv.innerHTML = `
                    <div class="detalhes">
                        <strong>${escaparHTML(item.nome)}</strong><br>
                        <small>R$ ${item.preco.toFixed(2).replace('.', ',')} x ${item.quantidade}</small>
                    </div>
                    <div class="controles">
                        <button onclick="alterarQuantidade('${id}', '${item.nome.replace(/'/g, "\\'")}', ${item.preco}, -1)">-</button>
                        <span>${item.quantidade}</span>
                        <button onclick="alterarQuantidade('${id}', '${item.nome.replace(/'/g, "\\'")}', ${item.preco}, 1)">+</button>
                    </div>
                `;
                listaDiv.appendChild(itemDiv);

                mensagem += `${contador}. ${item.quantidade}x ${item.nome} - R$ ${subtotal.toFixed(2).replace('.', ',')}\n`;
                contador++;
            }

            if (!temItens) {
                listaDiv.innerHTML = '<p style="color: #888; font-size: 14px;">Nenhum produto adicionado.</p>';
                totalDiv.style.display = "none";
                btnLimpar.style.display = "none";
            } else {
                totalDiv.style.display = "block";
                btnLimpar.style.display = "block";
                totalDiv.innerText = `Total: R$ ${valorTotal.toFixed(2).replace('.', ',')}`;
            }

            footerTotal.innerText = `R$ ${valorTotal.toFixed(2).replace('.', ',')}`;
            mensagem += `\n*Valor Total: R$ ${valorTotal.toFixed(2).replace('.', ',')}*`;

            mensagem += `\n\n*DADOS DO CLIENTE*\n`;
            mensagem += `Nome: ${cliente.nome || "(não informado)"}\n`;
            mensagem += `CPF/CNPJ: ${cliente.documento || "(não informado)"}\n`;
            mensagem += `Telefone: ${cliente.telefone || "(não informado)"}\n`;
            mensagem += `Endereço: ${cliente.endereco || "(não informado)"}`;

            const btnCotar = document.getElementById("btn-cotar");
            btnCotar.href = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;
            
            btnCotar.onclick = function(e) {
                if (!cliente.nome || !cliente.documento) {
                    e.preventDefault();
                    alert("Por favor, preencha e salve os dados do cliente (com CPF/CNPJ válido) antes de enviar a cotação.");
                    document.getElementById('cli-nome').focus();
                } else if (!temItens) {
                    e.preventDefault();
                    alert("Adicione pelo menos um produto ao carrinho antes de enviar.");
                }
            };
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'carrinho_distribuidora') {
                carrinho = JSON.parse(e.newValue) || {};
                renderizarProdutos();
                atualizarCarrinhoUI();
            }
            if (e.key === 'cliente_distribuidora') {
                cliente = JSON.parse(e.newValue) || {};
                atualizarInterfaceCliente();
            }
        });

        atualizarInterfaceCliente();
        renderizarProdutos();
        renderizarPaginacao();
    </script>

</body>
</html>
