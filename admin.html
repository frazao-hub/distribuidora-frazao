<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Distribuidora Frazão</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#27ae60">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Frazão Admin">

    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 800px; margin: auto; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { flex: 1; padding: 12px; background: #2c3e50; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 14px; text-align: center; min-width: 110px; }
        .tab-btn.active { background: #27ae60; }
        
        .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: none; }
        .card.active { display: block; }
        
        h2 { color: #27ae60; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin-top: 0; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #444; }
        input, select, textarea, button { padding: 10px; width: 100%; box-sizing: border-box; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        
        button.btn-salvar { background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button.btn-salvar:hover { background: #219653; }
        
        ul { list-style: none; padding: 0; margin-top: 10px; }
        li { background: #f9f9f9; padding: 12px; margin-top: 8px; border-left: 4px solid #27ae60; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; font-size: 14px; }
        
        .btn-excluir { background: #e74c3c; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-excluir:hover { background: #c0392b; }
        
        .venda-item { border-left-color: #3498db; flex-direction: column; align-items: flex-start; gap: 5px; }
        .venda-header { display: flex; justify-content: space-between; width: 100%; font-weight: bold; color: #2c3e50; }
        
        .btn-voltar { display: inline-block; margin-top: 25px; text-decoration: none; color: #3498db; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Menu de Abas -->
        <div class="tabs">
            <button class="tab-btn active" onclick="mudarAba('estoque', event)">📦 Estoque</button>
            <button class="tab-btn" onclick="mudarAba('clientes', event)">👥 Clientes</button>
            <button class="tab-btn" onclick="mudarAba('vendas', event)">🛒 Nova Venda</button>
            <button class="tab-btn" onclick="mudarAba('historico', event)">📊 Histórico</button>
        </div>

        <!-- ABA 1: ESTOQUE -->
        <div id="estoque" class="card active">
            <h2>Gerenciar Estoque e Catálogo</h2>
            <div class="form-group">
                <label>Nome do Produto:</label>
                <input type="text" id="prodNome" placeholder="Ex: Chocolate KitKat, Coca-Cola 2L...">
            </div>
            <div class="form-group">
                <label>Categoria:</label>
                <select id="prodCat">
                    <option value="Balas e Pirulitos">Balas e Pirulitos</option>
                    <option value="Bebidas">Bebidas</option>
                    <option value="Biscoitos">Biscoitos</option>
                    <option value="Descartáveis">Descartáveis</option>
                    <option value="Doces">Doces</option>
                    <option value="Drops e Chicletes">Drops e Chicletes</option>
                    <option value="Higiene">Higiene</option>
                    <option value="Limpeza">Limpeza</option>
                    <option value="Mercearia">Mercearia</option>
                    <option value="Papelaria">Papelaria</option>
                </select>
            </div>
            <div class="form-group">
                <label>Quantidade em Estoque:</label>
                <input type="number" id="prodQtd" placeholder="Ex: 50">
            </div>
            <div class="form-group">
                <label>Preço Unitário (R$):</label>
                <input type="number" step="0.01" id="prodPreco" placeholder="Ex: 8.50">
            </div>
            <button class="btn-salvar" onclick="salvarEstoque()">Salvar e Atualizar Catálogo</button>
            
            <input type="text" id="filtroEstoque" placeholder="🔍 Buscar no estoque..." onkeyup="carregarEstoque()" style="margin-top:20px;">
            <ul id="listaEstoque"></ul>
        </div>

        <!-- ABA 2: CLIENTES -->
        <div id="clientes" class="card">
            <h2>Cadastro de Clientes</h2>
            <div class="form-group">
                <label>Nome do Cliente / Estabelecimento:</label>
                <input type="text" id="cliNome" placeholder="Ex: Mercearia do João">
            </div>
            <div class="form-group">
                <label>Telefone / WhatsApp:</label>
                <input type="text" id="cliTel" placeholder="Ex: (21) 99999-9999">
            </div>
            <div class="form-group">
                <label>CPF ou CNPJ:</label>
                <input type="text" id="cliDoc" placeholder="Ex: 00.000.000/0001-00 ou 000.000.000-00">
            </div>
            <div class="form-group">
                <label>Endereço Completo:</label>
                <input type="text" id="cliEnd" placeholder="Ex: Rua Exemplo, 123 - Bairro - Cidade">
            </div>
            <button class="btn-salvar" onclick="salvarCliente()">Cadastrar Cliente</button>
            
            <ul id="listaClientes" style="margin-top:20px;"></ul>
        </div>

        <!-- ABA 3: REGISTRAR VENDA -->
        <div id="vendas" class="card">
            <h2>Registrar Nova Venda</h2>
            <div class="form-group">
                <label>Selecione o Cliente:</label>
                <select id="vendaCliente"></select>
            </div>
            <div class="form-group">
                <label>Selecione o Produto:</label>
                <select id="vendaProduto" onchange="atualizarPrecoVenda()"></select>
            </div>
            <div class="form-group">
                <label>Quantidade Vendida:</label>
                <input type="number" id="vendaQtd" value="1" min="1">
            </div>
            <div class="form-group">
                <label>Valor Total (R$):</label>
                <input type="text" id="vendaTotal" readonly style="background: #e9ecef;">
            </div>
            <button class="btn-salvar" onclick="registrarVenda()">Concluir Venda e Dar Baixa</button>
        </div>

        <!-- ABA 4: HISTÓRICO DE VENDAS -->
        <div id="historico" class="card">
            <h2>Histórico de Vendas</h2>
            <ul id="listaHistorico"></ul>
        </div>

        <a href="index.html" class="btn-voltar">← Ir para o Catálogo Público (Clientes)</a>
    </div>

    <script>
        function mudarAba(abaId, evt) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(abaId).classList.add('active');
            evt.currentTarget.classList.add('active');
            
            if(abaId === 'vendas') carregarSelectsVenda();
            if(abaId === 'historico') carregarHistorico();
            if(abaId === 'clientes') carregarClientes();
            if(abaId === 'estoque') carregarEstoque();
        }

        // --- ESTOQUE ---
        function salvarEstoque() {
            let produto = document.getElementById('prodNome').value.trim();
            let categoria = document.getElementById('prodCat').value;
            let qtd = parseInt(document.getElementById('prodQtd').value);
            let preco = parseFloat(document.getElementById('prodPreco').value);

            if(!produto || isNaN(qtd) || isNaN(preco)) {
                alert('Preencha todos os campos corretamente!');
                return;
            }

            let estoque = JSON.parse(localStorage.getItem('estoque_frazao_v2')) || [];
            let existente = estoque.find(p => p.produto.toLowerCase() === produto.toLowerCase());
            
            if(existente) {
                existente.qtd = qtd;
                existente.preco = preco;
                existente.categoria = categoria;
            } else {
                estoque.push({produto, categoria, qtd, preco});
            }

            localStorage.setItem('estoque_frazao_v2', JSON.stringify(estoque));
            
            document.getElementById('prodNome').value = '';
            document.getElementById('prodQtd').value = '';
            document.getElementById('prodPreco').value = '';
            carregarEstoque();
            alert('Produto salvo no estoque e sincronizado com o catálogo!');
        }

        function carregarEstoque() {
            let estoque = JSON.parse(localStorage.getItem('estoque_frazao_v2')) || [];
            let filtro = document.getElementById('filtroEstoque').value.toLowerCase();
            let lista = document.getElementById('listaEstoque');
            lista.innerHTML = '';

            let filtrados = estoque.filter(i => i.produto.toLowerCase().includes(filtro));
            if(filtrados.length === 0) {
                lista.innerHTML = '<li style="color:#7f8c8d;">Nenhum produto cadastrado.</li>';
                return;
            }

            filtrados.forEach((item) => {
                let idx = estoque.findIndex(p => p.produto === item.produto);
                lista.innerHTML += `
                    <li>
                        <div><strong>${item.produto}</strong> <small>(${item.categoria})</small><br>
                        Estoque: <strong>${item.qtd}</strong> | R$ ${item.preco ? item.preco.toFixed(2) : '0.00'}</div>
                        <button class="btn-excluir" onclick="removerEstoque(${idx})">Excluir</button>
                    </li>`;
            });
        }

        function removerEstoque(idx) {
            let estoque = JSON.parse(localStorage.getItem('estoque_frazao_v2')) || [];
            estoque.splice(idx, 1);
            localStorage.setItem('estoque_frazao_v2', JSON.stringify(estoque));
            carregarEstoque();
        }

        // --- CLIENTES ---
        function salvarCliente() {
            let nome = document.getElementById('cliNome').value.trim();
            let tel = document.getElementById('cliTel').value.trim();
            let doc = document.getElementById('cliDoc').value.trim();
            let end = document.getElementById('cliEnd').value.trim();

            if(!nome || !tel) {
                alert('Preencha pelo menos o Nome e o Telefone do cliente!');
                return;
            }

            let clientes = JSON.parse(localStorage.getItem('admin_clientes')) || [];
            clientes.push({nome, tel, doc, end});
            localStorage.setItem('admin_clientes', JSON.stringify(clientes));

            document.getElementById('cliNome').value = '';
            document.getElementById('cliTel').value = '';
            document.getElementById('cliDoc').value = '';
            document.getElementById('cliEnd').value = '';
            
            carregarClientes();
            alert('Cliente cadastrado com sucesso!');
        }

        function carregarClientes() {
            let clientes = JSON.parse(localStorage.getItem('admin_clientes')) || [];
            let lista = document.getElementById('listaClientes');
            lista.innerHTML = '';
            
            if(clientes.length === 0) {
                lista.innerHTML = '<li style="color:#7f8c8d;">Nenhum cliente cadastrado.</li>';
                return;
            }

            clientes.forEach((c, idx) => {
                let docInfo = c.doc ? `<br>Doc: ${c.doc}` : '';
                let endInfo = c.end ? `<br>End: ${c.end}` : '';
                lista.innerHTML += `
                    <li>
                        <div>
                            <strong>${c.nome}</strong><br>
                            <small>Tel: ${c.tel} ${docInfo} ${endInfo}</small>
                        </div> 
                        <button class="btn-excluir" onclick="removerCliente(${idx})">Excluir</button>
                    </li>`;
            });
        }

        function removerCliente(idx) {
            let clientes = JSON.parse(localStorage.getItem('admin_clientes')) || [];
            clientes.splice(idx, 1);
            localStorage.setItem('admin_clientes', JSON.stringify(clientes));
            carregarClientes();
        }

        // --- VENDAS ---
        function carregarSelectsVenda() {
            let clientes = JSON.parse(localStorage.getItem('admin_clientes')) || [];
            let estoque = JSON.parse(localStorage.getItem('estoque_frazao_v2')) || [];
            
            let selCli = document.getElementById('vendaCliente');
            selCli.innerHTML = '';
            if(clientes.length === 0) selCli.innerHTML = '<option value="">Cadastre um cliente primeiro</option>';
            clientes.forEach(c => { selCli.innerHTML += `<option value="${c.nome}">${c.nome}</option>`; });

            let selProd = document.getElementById('vendaProduto');
            selProd.innerHTML = '';
            if(estoque.length === 0) selProd.innerHTML = '<option value="">Adicione produtos no estoque</option>';
            estoque.forEach(p => { 
                let precoVal = p.preco || 0;
                selProd.innerHTML += `<option value="${p.produto}" data-preco="${precoVal}" data-qtd="${p.qtd}">${p.produto} [${p.categoria}] (Estoque: ${p.qtd} | R$ ${precoVal.toFixed(2)})</option>`; 
            });
            atualizarPrecoVenda();
        }

        function atualizarPrecoVenda() {
            let sel = document.getElementById('vendaProduto');
            let opt = sel.options[sel.selectedIndex];
            if(!opt) return;
            let preco = parseFloat(opt.getAttribute('data-preco')) || 0;
            let qtd = parseInt(document.getElementById('vendaQtd').value) || 1;
            document.getElementById('vendaTotal').value = (preco * qtd).toFixed(2);
        }

        document.getElementById('vendaQtd').addEventListener('input', atualizarPrecoVenda);

        function registrarVenda() {
            let cliente = document.getElementById('vendaCliente').value;
            let produtoNome = document.getElementById('vendaProduto').value;
            let qtdVendida = parseInt(document.getElementById('vendaQtd').value);
            let total = document.getElementById('vendaTotal').value;

            if(!cliente || !produtoNome || isNaN(qtdVendida)) {
                alert('Selecione cliente, produto e quantidade!');
                return;
            }

            let estoque = JSON.parse(localStorage.getItem('estoque_frazao_v2')) || [];
            let prod = estoque.find(p => p.produto === produtoNome);

            if(!prod || prod.qtd < qtdVendida) {
                alert('Quantidade em estoque insuficiente!');
                return;
            }

            prod.qtd -= qtdVendida;
            localStorage.setItem('estoque_frazao_v2', JSON.stringify(estoque));

            let historico = JSON.parse(localStorage.getItem('admin_vendas')) || [];
            let dataHora = new Date().toLocaleString('pt-BR');
            historico.unshift({ data: dataHora, cliente, produto: produtoNome, qtd: qtdVendida, total });
            localStorage.setItem('admin_vendas', JSON.stringify(historico));

            alert('Venda registrada com sucesso e estoque atualizado!');
            carregarSelectsVenda();
        }

        // --- HISTÓRICO ---
        function carregarHistorico() {
            let historico = JSON.parse(localStorage.getItem('admin_vendas')) || [];
            let lista = document.getElementById('listaHistorico');
            lista.innerHTML = '';
            if(historico.length === 0) {
                lista.innerHTML = '<li style="color:#7f8c8d;">Nenhuma venda registrada ainda.</li>';
                return;
            }
            historico.forEach(v => {
                lista.innerHTML += `
                    <li class="venda-item">
                        <div class="venda-header">
                            <span>🛒 ${v.cliente}</span>
                            <span style="color: #27ae60;">R$ ${v.total}</span>
                        </div>
                        <div style="font-size: 13px; color: #555;">
                            Produto: <strong>${v.produto}</strong> (Qtd: ${v.qtd})<br>
                            <small style="color: #888;">Data: ${v.data}</small>
                        </div>
                    </li>`;
            });
        }

        window.onload = carregarEstoque;
    </script>
</body>
</html>
