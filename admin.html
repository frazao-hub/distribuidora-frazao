<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Distribuidora Frazão</title>
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            margin: 0; 
            padding: 0; 
            color: #333; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        
        header { 
            background: #27ae60; 
            color: white; 
            text-align: center; 
            padding: 20px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header h1 { margin: 0 0 5px 0; font-size: 24px; text-transform: uppercase; }
        header p { margin: 0; font-size: 14px; opacity: 0.9; }

        .container { 
            max-width: 1000px; 
            margin: 20px auto; 
            padding: 0 20px; 
            flex: 1; 
            width: 100%; 
        }
        
        .card { 
            background: #fff; 
            border-radius: 8px; 
            padding: 25px; 
            margin-bottom: 25px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.06); 
        }
        .card h2 { 
            color: #27ae60; 
            margin-top: 0; 
            border-bottom: 2px solid #f0f0f0; 
            padding-bottom: 10px; 
            font-size: 18px; 
        }

        /* Formulário de Cadastro/Edição */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .btn-salvar {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-salvar:hover { background: #219150; }

        /* Tabela de Produtos */
        .tabela-container { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
            color: #27ae60;
        }
        .btn-acao {
            padding: 6px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-editar { background: #f39c12; color: white; margin-right: 5px; }
        .btn-excluir { background: #e74c3c; color: white; }

        footer { 
            background: #2c3e50; 
            color: #bdc3c7; 
            text-align: center; 
            padding: 15px; 
            font-size: 12px; 
            margin-top: auto; 
        }
    </style>
</head>
<body>

    <header>
        <h1>Painel Administrativo</h1>
        <p>Distribuidora Frazão — Gestão do Catálogo de Vendas</p>
    </header>

    <div class="container">
        
        <!-- Formulário para Inserir ou Editar Produtos -->
        <div class="card">
            <h2>Cadastrar / Atualizar Produto</h2>
            <form id="formProduto">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nomeProduto">Nome do Produto</label>
                        <input type="text" id="nomeProduto" placeholder="Ex: Biscrok Pedigree 500g" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="categoriaProduto">Categoria</label>
                        <select id="categoriaProduto" required>
                            <option value="">Selecione...</option>
                            <option value="balas-e-pirulitos">Balas e Pirulitos</option>
                            <option value="bebidas">Bebidas</option>
                            <option value="biscoitos">Biscoitos</option>
                            <option value="descartaveis">Descartáveis</option>
                            <option value="doces">Doces</option>
                            <option value="drops-e-chicletes">Drops e Chicletes</option>
                            <option value="higiene">Higiene</option>
                            <option value="limpeza">Limpeza</option>
                            <option value="mercearia">Mercearia</option>
                            <option value="papelaria">Papelaria</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="precoProduto">Preço (R$)</label>
                        <input type="number" id="precoProduto" step="0.01" placeholder="0,00" required>
                    </div>

                    <div class="form-group">
                        <label for="fotoProduto">Nome do Arquivo de Imagem</label>
                        <input type="text" id="fotoProduto" placeholder="Ex: produto1.jpg">
                    </div>
                </div>
                
                <button type="submit" class="btn-salvar">Salvar no Catálogo</button>
            </form>
        </div>

        <!-- Lista de Produtos Cadastrados -->
        <div class="card">
            <h2>Produtos No Catálogo</h2>
            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Imagem</th>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos">
                        <!-- Itens carregados via script -->
                        <tr>
                            <td colspan="5" style="text-align:center; color: #888;">Nenhum produto cadastrado até o momento.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <footer>
        &copy; 2026 Distribuidora Frazão — Área Restrita de Gerenciamento.
    </footer>

</body>
</html>
